# O frontend no Docker: o site compilado e, em /api, o backend (como o proxy
# do Vite no npm run dev). O navegador só fala com este container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # /api/packages -> http://backend:8080/packages (a barra no fim tira o /api)
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # upload de pastas inteiras de imagens: sem limite de tamanho e sem
    # guardar o corpo no nginx (o backend lê em streaming)
    client_max_body_size 0;
    proxy_request_buffering off;
    # zips grandes (export, imagens para o CVAT) saem direto para o navegador
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # os arquivos do build têm hash no nome: podem ficar em cache para sempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # rotas do React (/pacotes/x, /configurar...): sempre o index.html,
  # sem cache, para pegar a versão nova depois de um deploy
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
