name: sidm

services:
  mongo:
    image: mongo:8
    container_name: sidm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina no .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?defina no .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?defina no .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  backend:
    build: ./backend
    container_name: sidm-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MONGO_URI: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/sidm?authSource=sidm"
      MONGO_DB: "sidm"
      IMAGES_DIR: "/data/images"
      # o primeiro admin do login (só cria se ainda não há nenhum admin ativo)
      SIDM_ADMIN_USER: ${SIDM_ADMIN_USER:-}
      SIDM_ADMIN_EMAIL: ${SIDM_ADMIN_EMAIL:-}
      SIDM_ADMIN_PASSWORD: ${SIDM_ADMIN_PASSWORD:-}
      # Processar: o detector de placas (container lpr-class, do .deb
      # splice-lpr), publicado no host na porta 54321. Não usa o LPR_ADDR do
      # .env: aquele é o do go run (127.0.0.1), que dentro do container é o
      # próprio container.
      LPR_ADDR: ${LPR_DOCKER_ADDR:-host.docker.internal:54321}
      # o contador de eixos (container axlecounter.software, rede do host, porta 54323)
      AXLE_ADDR: ${AXLE_DOCKER_ADDR:-host.docker.internal:54323}
    extra_hosts:
      # no Linux o host.docker.internal não existe sozinho: aponta para o host
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${IMAGES_HOST_DIR:-./data/images}:/data/images
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - frontend

  # o site compilado num nginx; /api vai para o backend pela rede frontend
  frontend:
    build: ./frontend
    container_name: sidm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, não localhost: no Alpine o localhost vai para o IPv6 (::1), e o nginx escuta só em IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

networks:
  backend:   # mongo <-> backend
  frontend:  # backend <-> frontend (o front nunca enxerga o Mongo)

volumes:
  mongo-data:
