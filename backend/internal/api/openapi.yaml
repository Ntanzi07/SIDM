openapi: 3.0.3
info:
  title: SIDM API
  version: "1.0"
  description: |
    Controle e anotação de imagens de veículos.

    **Fluxo:** criar pacote → upload → fila de anotação (`/next`) → verificar (`PUT` com `complete: true`).

    **Login:** tudo, menos `/health`, a documentação e o `/auth/*` público, pede uma
    sessão (o cookie `sidm_session`, de `POST /auth/login`, dura 8 horas). Sem
    sessão: **401**; sem permissão: **403**. Quem está agindo vem da sessão: um
    header `X-User` mandado pelo navegador é descartado (o servidor escreve o
    da sessão). **Usuário normal** lê tudo e grava só: anotar (fila, campos,
    caixas, cadastrar equipamento/câmera), importar (criar pacote, subir
    imagens, CSV, caixas do CVAT), apagar imagens, baixar o export e criar
    datasets e versões. **O resto é só admin** (403): tarefas e labels,
    perfis (anotação, import, export), renomear/apagar pacotes, apagar
    datasets e versões, cadastros e as contas (`/users`).

    **Listagens** respondem sempre `{"total": N, "items": [...]}`, com `limit` e `skip` para paginar.

    **Erros** respondem sempre `{"error": "mensagem"}`.

tags:
  - name: sistema
  - name: login
    description: |
      Contas e sessões. Quem se cadastra fica **pendente** até um admin aprovar.
      A senha é guardada só como hash (PBKDF2-SHA256); a sessão é um cookie
      HttpOnly. Entra-se pelo **e-mail** (ou pelo nome de usuário). O primeiro
      admin vem do `.env` (`SIDM_ADMIN_USER`, `SIDM_ADMIN_EMAIL` e
      `SIDM_ADMIN_PASSWORD`), só quando ainda não há nenhum admin ativo.
  - name: cadastros
    description: Equipamentos e câmeras.
  - name: pacotes
  - name: imagens
  - name: fila
    description: Fila de trabalho compartilhada (várias pessoas anotando o mesmo pacote).
  - name: import
    description: Import de metadados por CSV, usando perfis.
  - name: export
    description: |
      Datasets de treino (RF-DETR / YOLO / Pascal VOC). Entram as imagens **verificadas** e
      **anotadas na tarefa** escolhida que passam nos filtros do perfil (as
      anotadas sem nenhuma caixa entram como negativas). No formato `images`
      (só imagens) não há tarefa nem caixas: entra toda verificada que passa nos
      filtros, com o nome de saída e um `anotacoes.csv`. A divisão
      train/valid/test é **fixa por imagem** (pelo sha1). Perfis padrão:
      `rf-detr`, `yolo`, `voc`, `voc-pastas` e `imagens`.
  - name: perfis de anotação
    description: |
      O que se anota em cada imagem: os **campos da imagem** e os **tipos de
      objeto** (cada um com os seus campos; com caixa, o tipo é uma label do
      CVAT). O padrão `veiculos` reproduz os campos de sempre, com os códigos do
      nome v2. Cada pacote tem um perfil (`profile`), e as imagens guardam a
      anotação em `fields` e `objects`.
  - name: versões
    description: |
      **Datasets** (uma pesquisa salva: perfil de anotação, pacotes, filtros e
      tarefas) e as **versões** deles: fotos congeladas das imagens
      **verificadas** que passavam, com a anotação de cada uma (campos, objetos
      e caixas por tarefa), quem criou, quando e uma mensagem. As imagens não
      são copiadas (no disco já são imutáveis); uma versão nunca muda: corrigir
      gera a próxima.
  - name: caixas
    description: |
      Caixas (bounding boxes) anotadas no CVAT, por **tarefa** (ex.: `capacete`,
      `placa-letras`): a mesma imagem pode estar em várias tarefas sem uma
      sobrescrever a outra. O SIDM não desenha caixas: manda as imagens para o
      CVAT (cvat.zip) e importa o export COCO 1.0 de volta, na tarefa.

  - name: processar
    description: |
      Pré-anotação por **modelos de IA**: um modelo passa pelas imagens dos
      pacotes escolhidos (só pendentes, só verificadas ou todas) e grava as
      caixas que achou numa **tarefa** (padrão `pre-<modelo>`), para uma pessoa
      só corrigir. Hoje há o **LPR** (o detector de placas da Splice, o container
      `lpr-class`, ligado por `LPR_ADDR`) e o contador de **eixos** (o container
      `axlecounter.software`, ligado por `AXLE_ADDR`). O arquivo nunca muda, os campos e o
      status das imagens também não. Caixas que vieram do CVAT ou foram
      editadas no SIDM **nunca** são sobrescritas: a imagem é pulada e entra no
      relatório. Um processamento por modelo de cada vez, em segundo plano.
      **Todas as rotas são só de admin**, até as de leitura (403 para o usuário normal).

paths:
  /auth/register:
    post:
      tags: [login]
      summary: Cadastrar (fica pendente)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, example: maria.silva@empresa.com.br, description: "Único; é com ele que a pessoa entra." }
                username: { type: string, example: maria.silva, description: "Opcional: sem ele, sai do e-mail (a parte antes do @; se já existe, ganha -2, -3...). É o nome do histórico das imagens." }
                name: { type: string, example: Maria Silva }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "201":
          description: Conta criada, pendente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: "E-mail que já tem conta.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/login:
    post:
      tags: [login]
      summary: Entrar
      description: Abre uma sessão de 8 horas (cookie `sidm_session`). Depois de 5 senhas erradas seguidas, o usuário espera 5 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, example: maria.silva@empresa.com.br, description: "O e-mail (com @) ou o nome de usuário. `username` (o nome antigo do campo) ainda vale." }
                password: { type: string, format: password }
      responses:
        "200":
          description: Entrou.
          headers:
            Set-Cookie: { schema: { type: string, example: "sidm_session=...; Path=/; HttpOnly; SameSite=Lax" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Conta pendente ou desativada.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Muitas tentativas erradas.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/logout:
    post:
      tags: [login]
      summary: Sair
      security: []
      responses:
        "204": { description: Saiu (o cookie é apagado). }

  /auth/me:
    get:
      tags: [login]
      summary: Quem está logado
      security: []
      responses:
        "200":
          description: A conta da sessão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/shortcuts:
    put:
      tags: [contas]
      summary: Trocar os próprios atalhos de teclado
      description: |
        Troca todos os atalhos da pessoa logada (ação → tecla, ex.:
        `annotation.next` → `f`, `annotation.save` → `ctrl+enter`). A tela é quem
        conhece as ações; ação sem tecla usa o padrão da tela, e `none` deixa a
        ação sem atalho. Uma tecla não pode servir a duas ações. `{}` volta aos
        padrões. Vem em `shortcuts` no `GET /auth/me`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              example: { annotation.next: f, annotation.previous: d }
      responses:
        "200": { description: A conta, com os atalhos novos. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Sem login. }

  /auth/password:
    put:
      tags: [login]
      summary: Trocar a própria senha
      description: As outras sessões da pessoa caem; esta continua (ganha um cookie novo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string, format: password }
                new: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Trocada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [login]
      summary: Listar as contas (admin)
      responses:
        "200":
          description: As contas, por nome de usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [login]
      summary: Cadastrar uma conta já ativa (admin)
      description: |
        O admin cadastra um colaborador. A conta nasce **ativa**, aprovada por quem
        criou (sem passar pela fila de aprovação). Mesmas regras do `/auth/register`:
        o e-mail é único e o nome de usuário sai dele (`-2`, `-3`... se já existe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, example: maria.silva@empresa.com.br }
                name: { type: string, example: Maria Silva }
                password: { type: string, format: password, minLength: 8, description: "Passe por um canal seguro; a pessoa troca depois em Trocar a senha." }
                role: { type: string, enum: [admin, user], default: user }
      responses:
        "201":
          description: Conta criada, ativa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "E-mail que já tem conta.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /users/{username}:
    patch:
      tags: [login]
      summary: Aprovar, desativar ou trocar o papel (admin)
      description: O sistema nunca fica sem nenhum admin ativo (409). Desativar fecha as sessões da pessoa na hora.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, disabled], description: "active: aprova (pendente) ou reativa." }
                role: { type: string, enum: [admin, user] }
                name: { type: string }
      responses:
        "200":
          description: A conta como ficou.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{username}/password:
    put:
      tags: [login]
      summary: Definir uma senha nova para alguém (admin)
      description: Para quem esqueceu. As sessões da pessoa caem.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Definida. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      tags: [sistema]
      summary: Saúde do serviço
      description: Responde `ok` se o Mongo está acessível.
      responses:
        "200":
          description: Tudo certo.
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Mongo indisponível.

  /codes:
    get:
      tags: [cadastros]
      summary: Tabelas fixas do padrão v2
      description: |
        Para os dropdowns: código → valor, por campo. Equipamentos e câmeras
        **não** vêm aqui (têm busca própria: `/equipments` e `/cameras`).
      responses:
        "200":
          description: Tabelas por campo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
              example:
                day_time: { D: day, N: night }
                weather: { S: clear, C: rain, N: fog }

  /equipments:
    get:
      tags: [cadastros]
      summary: Buscar equipamentos (autocomplete)
      description: Busca por "contém", sem diferenciar maiúscula. `mf47` encontra `8003-MF4739`. Só os ativos; com `inactive=true`, só os desativados (para reativar com o PATCH).
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/Inactive"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar equipamento
      description: O nome é sanitizado (espaço vira `-`; só `A-Z a-z 0-9 -`).
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras:
    get:
      tags: [cadastros]
      summary: Buscar câmeras (autocomplete)
      description: Só as ativas; com `inactive=true`, só as desativadas.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/Inactive"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar câmera
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /equipments/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar equipamento
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o nome v2 (no banco) é calculado de novo. Nenhum arquivo muda. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir equipamento
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /cameras/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar câmera
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o nome v2 (no banco) é calculado de novo. Nenhum arquivo muda. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir câmera
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages:
    get:
      tags: [pacotes]
      summary: Listar pacotes com progresso
      description: Mais novos primeiro.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de pacotes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackageSummary" }
    post:
      tags: [pacotes]
      summary: Criar pacote
      description: |
        O nome vira nome de pasta no servidor, por isso é sanitizado. A pasta é
        criada na hora. `profile` é o perfil de anotação das imagens (sem ele, o
        padrão `veiculos`).
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageBody" }
            example: { name: Motos Setembro, profile: capacete-moto }
      responses:
        "201":
          description: Criado; o nome já sanitizado e o perfil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: Motos-Setembro }
                  profile: { type: string, example: capacete-moto }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /packages/{name}:
    patch:
      tags: [pacotes]
      summary: Renomear pacote ou trocar o perfil
      description: |
        `name`: renomeia a pasta no servidor, o cadastro e o caminho de todas as
        imagens (o nome dos arquivos não muda). `profile`: troca o perfil de
        anotação, **só enquanto o pacote não tem imagem verificada** (o nome do
        arquivo delas saiu do perfil atual). Com os dois, o perfil vai primeiro.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageBody" }
      responses:
        "200":
          description: Alterado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  profile: { type: string }
                  images: { type: integer, description: Imagens levadas para o nome novo. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [pacotes]
      summary: Excluir pacote (IRREVERSÍVEL)
      description: |
        Apaga o pacote, **todas as imagens dele** (banco e arquivos no disco) e o
        histórico. Para confirmar, repita o nome do pacote em `confirm`.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - name: confirm
          in: query
          required: true
          description: O nome do pacote, de novo.
          schema: { type: string }
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted_images: { type: integer }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/cvat.zip:
    get:
      tags: [caixas]
      summary: Imagens do pacote para o CVAT
      description: |
        Um zip com as imagens do pacote, com os nomes guardados no SIDM (que
        começam pelo sha1). Use-o para criar a task no CVAT: assim, o export de
        volta casa com as imagens sem ambiguidade. Imagens que não puderam ser
        incluídas são listadas em `FALTANDO.txt` dentro do zip.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /boxes/images.zip:
    get:
      tags: [caixas]
      summary: Imagens de vários pacotes, num zip só
      description: |
        O mesmo zip do `/packages/{name}/cvat.zip`, com as imagens de todos os
        pacotes pedidos (para rotular de uma vez). Os nomes começam pelo sha1,
        então não se repetem entre pacotes.
      parameters:
        - name: package
          in: query
          required: true
          description: Um pacote; repita para vários.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/boxes:
    get:
      tags: [caixas]
      summary: Tarefas em que o pacote tem imagens anotadas
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Por tarefa, imagens do pacote anotadas nela e total de caixas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { type: string }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task: { type: string }
                        images: { type: integer }
                        boxes: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/boxes/link:
    post:
      tags: [caixas]
      summary: Ligar de novo as caixas do pacote aos objetos
      description: |
        O mesmo que o import das caixas já faz em cada imagem (ver `links` no
        relatório do import): a caixa de uma label que representa um tipo
        (`box_labels` do perfil) vira um objeto, ou se liga ao único objeto do
        tipo sem caixa. Numa imagem verificada só liga, sem mudar valor nenhum.
        Útil para caixas importadas antes, ou depois de mudar o perfil.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: O que foi feito, somado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      tags: [caixas]
      summary: Tarefas de anotação (com o resumo de cada uma)
      responses:
        "200":
          description: Todas as tarefas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskView" }
    post:
      tags: [caixas]
      summary: Criar tarefa
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "201":
          description: Criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: capacete }
    get:
      tags: [caixas]
      summary: Uma tarefa, com os pacotes e as caixas por label
      responses:
        "200":
          description: A tarefa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [caixas]
      summary: Atualizar tarefa
      description: Mudar o nome leva junto as caixas e os perfis de export que apontam para ela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "200":
          description: Atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [caixas]
      summary: Apagar tarefa e as caixas dela
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  images: { type: integer, description: Imagens que tinham caixas na tarefa. }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{name}/import:
    post:
      tags: [caixas]
      summary: Importar caixas do CVAT (COCO 1.0) na tarefa
      description: |
        Mande o export da task do CVAT no formato **COCO 1.0** (o zip, ou só o
        `.json`). Por padrão é um **ensaio** (`dry_run=true`): nada é gravado.

        As imagens são procuradas no **banco todo** (qualquer pacote), pelo nome
        do arquivo (sem pasta): se começa pelo sha1, é por ele; senão, pelo
        nome original, só se for único no banco.

        - Imagens **sem caixa** no arquivo: com `negatives=false` (padrão) não
          são mexidas (o CVAT exporta todas as imagens da task, inclusive as não
          anotadas). Com `negatives=true` entram como anotadas e vazias: use só
          com a task do CVAT toda anotada.
        - Imagens cujo **tamanho** no CVAT difere do arquivo guardado são puladas.
        - Reimportar **substitui** as caixas da imagem nesta tarefa (as outras
          tarefas não mudam).
        - Labels que a tarefa ainda não tem são **acrescentadas** a ela.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XUser"
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: negatives
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "Zip do CVAT ou o .json (COCO 1.0)." }
      responses:
        "200":
          description: Relatório.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export-folder-fields:
    get:
      tags: [export]
      summary: Metadados que podem virar pasta ou parte do nome (de um perfil de anotação)
      description: |
        Os metadados que um perfil de anotação dá às imagens, para os níveis de
        pasta (`layout: folders`) e o modelo de nome (`file_name`) de um perfil
        de export. Além de `sha1`, `name`, `original`, `package` e `split`
        (o grupo da divisão), cada campo da imagem vale pela chave
        (`day_time`) e cada campo de objeto sem caixa como `<tipo>_<campo>`
        (`vehicle_type`, do primeiro objeto do tipo). `values` traz cada valor
        possível e o nome padrão da pasta (na resolução, `01-640x480`); `null`
        = campo aberto (equipamento, número, texto): a pasta é o próprio valor.
      parameters:
        - name: annotation_profile
          in: query
          schema: { type: string, default: veiculos }
          description: O perfil de anotação (o `annotation_profile` do perfil de export).
      responses:
        "200":
          description: Os campos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation_profile: { type: string, example: veiculos }
                  unknown: { type: string, example: Desconhecido, description: Pasta padrão das imagens sem o metadado. }
                  name_fields:
                    type: array
                    items: { type: string }
                    description: Campos aceitos no modelo de nome dos arquivos (file_name).
                  legacy_template: { type: string, description: "O padrão antigo (hash + características + placa). Vazio fora do perfil veiculos." }
                  fields:
                    type: array
                    description: Todos os metadados, com o nome na tela.
                    items:
                      type: object
                      properties:
                        field: { type: string, example: vehicle_type }
                        label: { type: string, example: "Veículo: Tipo de veículo" }
                        group: { type: string, description: "file, image ou o tipo do objeto (ex.: vehicle)." }
                        values:
                          type: object
                          nullable: true
                          additionalProperties: { type: string }
                        labels:
                          type: object
                          additionalProperties: { type: string }
                          description: Valor -> nome na tela.
                        folder: { type: boolean, description: Serve de nível de pasta. }
                        name: { type: boolean, description: Serve no modelo de nome. }
                        alias: { type: boolean, description: "Nome antigo ou atalho de outro campo (ex.: plate = vehicle_plate). Aceito, mas a tela não oferece." }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string, example: direction }
                        values:
                          type: object
                          nullable: true
                          additionalProperties: { type: string }
                          example: { front: front, rear: rear }

  /export-profiles:
    get:
      tags: [export]
      summary: Listar perfis de export
      description: Os padrões (`rf-detr`, `yolo`, com `builtin` true) e os salvos.
      responses:
        "200":
          description: Perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportProfile" }
    post:
      tags: [export]
      summary: Criar perfil de export
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /export-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: rf-detr }
    get:
      tags: [export]
      summary: Um perfil de export
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [export]
      summary: Atualizar perfil de export
      description: Os perfis padrão não podem ser alterados (salve uma cópia com outro nome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [export]
      summary: Apagar perfil de export
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/preview:
    post:
      tags: [export]
      summary: Prévia do dataset
      description: O que vai sair, sem gerar o zip. `profile` é o nome de um perfil ou um perfil inteiro (montado na tela, sem salvar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: Prévia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/download:
    post:
      tags: [export]
      summary: Baixar o dataset (zip)
      description: |
        Gera o zip enquanto baixa. Também aceita o pedido como formulário
        (`application/x-www-form-urlencoded`, campo `request` com o mesmo JSON),
        para o navegador salvar direto no disco.

        - **coco** (RF-DETR): `train/`, `valid/`, `test/`, cada um com as imagens e
          `_annotations.coco.json`.
        - **yolo** (Ultralytics): `images/{train,val,test}`, `labels/{train,val,test}`
          e `data.yaml`.

        Sempre vai junto um `export_info.json` (perfil, data, contagens). Caixas
        rotacionadas viram o menor retângulo reto que as contém.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request: { type: string, description: 'O mesmo JSON, ex.: {"profile":"yolo"}' }
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /annotation-profiles:
    get:
      tags: [perfis de anotação]
      summary: Listar perfis de anotação
      description: O padrão (`veiculos`, com `builtin` true) e os salvos.
      responses:
        "200":
          description: Perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnnotationProfile" }
    post:
      tags: [perfis de anotação]
      summary: Criar perfil de anotação
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationProfile" }
      responses:
        "201":
          description: Criado (já limpo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "400": { $ref: "#/components/responses/Problems" }
        "409": { $ref: "#/components/responses/Conflict" }

  /annotation-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: veiculos }
    get:
      tags: [perfis de anotação]
      summary: Um perfil de anotação
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [perfis de anotação]
      summary: Atualizar perfil de anotação
      description: De um perfil padrão, só mudam as `box_labels` de cada tipo de objeto (o resto que vier é ignorado; para mudar o resto, salve uma cópia com outro nome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationProfile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [perfis de anotação]
      summary: Apagar perfil de anotação
      description: O padrão não pode ser apagado, nem um perfil em uso por algum pacote (a mensagem diz quais).
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /annotation-profiles/{name}/check:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: veiculos }
    post:
      tags: [perfis de anotação]
      summary: Conferir uma anotação contra o perfil
      description: |
        Não grava nada. Devolve os valores limpos (texto sem espaços,
        maiúsculas onde o campo pede, data em UTC) ou a lista de problemas.
        Com `complete` true também cobra os obrigatórios e o mínimo de objetos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnnotationValues"
                - type: object
                  properties:
                    complete: { type: boolean }
            example:
              fields: { direction: rear, day_time: night }
              objects: [{ type: vehicle, fields: { plate: abc1d23, type: car } }]
              complete: true
      responses:
        "200":
          description: Válida; os valores limpos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationValues" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }

  /system/storage:
    get:
      tags: [sistema]
      summary: O disco das imagens, a lixeira e os envios parados (só admin)
      description: |
        `disk`: tamanho e livre do disco onde ficam as imagens (`warn` a partir de 90%
        usado). `trash`: arquivos e bytes na lixeira. `uploads`: os envios de zip que
        não terminaram (com o que os .zip ocupam).
      responses:
        "200":
          description: O resumo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  disk:
                    type: object
                    properties:
                      total: { type: integer }
                      free: { type: integer }
                      used_percent: { type: number }
                      warn: { type: boolean }
                  trash:
                    type: object
                    properties:
                      count: { type: integer }
                      bytes: { type: integer }
                  uploads:
                    type: object
                    properties:
                      count: { type: integer }
                      bytes: { type: integer }
                      items: { type: array, items: { $ref: "#/components/schemas/ZipUpload" } }
        "403": { description: Só admin. }

  /system/from-image:
    post:
      tags: [sistema]
      summary: Corrigir pelo arquivo os campos que vêm da imagem (ex.: a resolução; só admin)
      description: |
        Para as imagens gravadas antes de o campo vir da imagem (`from_image`), quando era
        escolhido à mão: mede cada arquivo e põe o valor certo. **O padrão é ensaio**
        (`dry_run` ausente ou true: só conta). Corrigindo, a verificada ganha o nome v2
        novo (ele leva o código da resolução) e cada mudança fica no histórico
        ("<usuário> via resolução da imagem"). Imagem que alguém está anotando é pulada.
        Faça backup do banco antes de corrigir.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: true }
      responses:
        "200":
          description: O que muda (ou mudou).
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  checked: { type: integer, description: "Imagens de perfis com campo que vem da imagem." }
                  changed: { type: integer, description: "Com o valor diferente do arquivo." }
                  verified: { type: integer, description: "Das que mudam, verificadas: o nome v2 muda junto." }
                  cleared: { type: integer, description: "Das que mudam, o tamanho não é opção: o campo fica vazio." }
                  busy: { type: integer, description: "Alguém está anotando: puladas." }
                  failed: { type: integer }
                  examples: { type: array, items: { type: string }, description: "Algumas das que mudam (antes → depois)." }
                  errors: { type: array, items: { type: string } }

  /system/trash/purge:
    post:
      tags: [sistema]
      summary: Esvaziar a lixeira (o que está lá há mais de N dias; só admin)
      description: |
        Apaga de vez o registro e o arquivo das imagens apagadas há mais de
        `older_than_days` dias (0 = tudo). Depois disso, uma versão antiga não
        consegue mais trazer essas imagens de volta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [older_than_days]
              properties:
                older_than_days: { type: integer, minimum: 0, maximum: 3650 }
      responses:
        "200":
          description: O que saiu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images: { type: integer }
                  bytes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Só admin. }

  /packages/{name}/zip-uploads:
    parameters:
      - $ref: "#/components/parameters/PackageName"
    post:
      tags: [imagens]
      summary: Começar (ou retomar) o envio de um .zip em partes
      description: |
        Para pastas grandes: a tela manda o zip em partes (`PUT /zip-uploads/{id}/chunk`)
        e, quando chega tudo, `POST /zip-uploads/{id}/finish` grava as imagens em
        segundo plano. Se já existe um envio que não terminou do mesmo arquivo
        (pacote, nome e tamanho), ele é devolvido, com `received` dizendo de onde
        continuar. Antes, confere o disco: o resto do zip e as imagens dele (~2x o
        tamanho), com 1 GB de folga; sem espaço, 507.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, size]
              properties:
                file_name: { type: string, example: fotos.zip }
                size: { type: integer, description: Tamanho do zip em bytes. }
                profile: { type: string, description: "Perfil de INI (jpeg-ini), como no upload." }
      responses:
        "200":
          description: O envio (novo ou o que não terminou).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "507":
          description: Falta espaço em disco para o zip e as imagens dele (a mensagem diz quanto).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [imagens]
      summary: Os envios de zip do pacote (o mais novo primeiro)
      responses:
        "200":
          description: Os envios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ZipUpload" } }

  /zip-uploads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [imagens]
      summary: Um envio de zip (o progresso)
      responses:
        "200":
          description: O envio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipUpload" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [imagens]
      summary: Cancelar o envio (apaga o zip; as imagens já gravadas ficam)
      responses:
        "200": { description: Apagado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /zip-uploads/{id}/chunk:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: offset, in: query, required: true, schema: { type: integer }, description: "Onde a parte começa (o `received` do envio)." }
    put:
      tags: [imagens]
      summary: Mandar uma parte do zip (até 64 MB, o corpo cru)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: O envio, com o novo `received`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A parte não começa onde o envio parou; `upload.received` diz onde.
        "507":
          description: O disco encheu: a parte não foi gravada (o `received` não muda). Não adianta tentar de novo sem liberar espaço.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zip-uploads/{id}/finish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [imagens]
      summary: Gravar as imagens do zip (em segundo plano)
      description: |
        Abre o zip e grava cada imagem como no upload (criptografia, INI, repetidas
        puladas). Segue mesmo se o navegador fechar; acompanhe com `GET
        /zip-uploads/{id}`. No fim, o zip é apagado. Se o servidor reiniciar no
        meio (`running` false com status `processing`), chamar de novo continua
        de onde parou.
      responses:
        "202":
          description: Começou (ou já estava rodando).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZipUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "507":
          description: Falta espaço em disco para gravar as imagens do zip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /packages/{name}/next:
    post:
      tags: [fila]
      summary: Pegar a próxima imagem da fila
      description: |
        Entrega a imagem pendente livre mais antiga do pacote e reserva para o
        usuário por 15 minutos. Recarregar devolve a mesma imagem. Duas pessoas
        nunca recebem a mesma imagem.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUserRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skip:
                  type: string
                  description: sha1 da imagem atual, para pular (ela vai para o fim da fila).
      responses:
        "200":
          description: A imagem, já reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "204": { description: Fila vazia. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/import:
    post:
      tags: [import]
      summary: Importar um CSV para os rascunhos do pacote
      description: |
        Casa cada linha do CSV com uma imagem do pacote e preenche o **rascunho**
        (nunca verifica). Equipamentos e câmeras novos são cadastrados.

        **O padrão é ensaio**: só grava com `dry_run=false`.

        Com um perfil do tipo `jpeg-ini`, **não mande arquivo**: o import usa o INI
        já guardado de cada imagem pendente do pacote.

        **Andamento**: com `Accept: application/x-ndjson`, a resposta vem aos poucos,
        uma linha JSON por vez: `{"progress": {"phase", "done", "total"}}` (fases
        `lendo`, `conferindo`, `cadastros`, `gravando` — esta só ao aplicar) e, no
        fim, `{"report": ImportReport}` ou `{"error": "..."}`. Os erros de antes de
        começar (pacote, perfil, arquivo) continuam vindo como 400/404.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUser"
        - name: profile
          in: query
          required: true
          schema: { type: string }
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: overwrite
          in: query
          description: "false: só preenche campos vazios. true: o CSV substitui o rascunho."
          schema: { type: boolean, default: false }
      requestBody:
        required: false
        description: O CSV (não precisa com perfil jpeg-ini).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Relatório do import (ou, com Accept application/x-ndjson, o andamento linha a linha).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
            application/x-ndjson:
              schema:
                type: object
                description: Uma por linha. As do meio têm progress; a última, report ou error.
                properties:
                  progress:
                    type: object
                    properties:
                      phase: { type: string, enum: [lendo, conferindo, cadastros, gravando] }
                      done: { type: integer }
                      total: { type: integer, description: "0 nas fases sem contagem." }
                  report: { $ref: "#/components/schemas/ImportReport" }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Arquivo maior que 20 MB. }

  /images:
    get:
      tags: [imagens]
      summary: Buscar imagens
      description: |
        Filtros pelos campos do perfil de anotação: `fields.<campo>=valor` (um
        campo da imagem; numa lista, basta conter o valor) e
        `objects.<campo>=valor` (os de objeto valem para o **mesmo** objeto:
        `objects.type=truck&objects.color=white` não traz uma imagem com um
        caminhão preto e um carro branco). Ex.: `fields.day_time=night`.

        Os nomes de antes dos perfis continuam valendo: `equipment`, `camera`,
        `day_time`, `weather` e `direction` (= `fields.*`), e `vehicle_type`,
        `vehicle_color` e `plate` (= `objects.type`, `objects.color`,
        `objects.plate`).
      parameters:
        - { name: package, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, verified] } }
        - { name: fields.day_time, in: query, description: "Exemplo de fields.<campo>.", schema: { type: string } }
        - { name: objects.color, in: query, description: "Exemplo de objects.<campo>.", schema: { type: string } }
        - { name: equipment, in: query, schema: { type: string } }
        - { name: camera, in: query, schema: { type: string } }
        - { name: day_time, in: query, schema: { type: string } }
        - { name: weather, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string } }
        - { name: vehicle_type, in: query, schema: { type: string } }
        - { name: vehicle_color, in: query, schema: { type: string } }
        - { name: plate, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de imagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Image" }
    post:
      tags: [imagens]
      summary: Upload de imagens para um pacote
      description: |
        Imagem repetida (mesmo conteúdo) que já está em outro pacote é **pulada**,
        e o resto do lote segue.

        O INI que o equipamento grava **dentro** do JPEG é sempre guardado no banco
        (menos a assinatura). Com `profile` (do tipo `jpeg-ini`), ele também
        pré-preenche o rascunho. O arquivo nunca é alterado.

        **Arquivos criptografados** pelo equipamento são abertos sozinhos: o
        formato RC4 legado (qualquer extensão; vira `.jpg`). O hash, o INI e o
        arquivo guardado são os do original aberto. O formato PGP ainda é recusado.
      parameters:
        - name: package
          in: query
          required: true
          schema: { type: string }
        - name: profile
          in: query
          description: Perfil do tipo jpeg-ini, opcional.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Resultado de cada arquivo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/stats:
    get:
      tags: [imagens]
      summary: Contagens de um perfil de anotação (pesquisa/dashboard)
      description: |
        Quantas imagens dos pacotes que usam o perfil passam no filtro, e quantas
        têm cada valor de cada campo de lista ou sim/não (choice, multi, bool),
        por pacote e por status. Sempre de **um** perfil.

        Filtros pelos campos do perfil: `fields.<campo>=valor` e
        `objects.<tipo>.<campo>=valor` (os de um mesmo tipo valem para o
        **mesmo** objeto). O valor pode ser o valor, o código ou o nome da
        opção; sim/não é `true`/`false`. Campo ou opção que o perfil não tem: 400.

        Num campo `multi` a imagem conta em cada valor que tem: a soma passa do
        total. `missing` traz, por campo, quantas ficaram sem valor ("Não
        informado"). Em `objects`, `images` conta imagens com o tipo e `count`
        conta objetos; os `fields` e o `missing` de um objeto contam objetos. Tipos de objeto com
        caixa (CVAT) não entram: as caixas ficam no módulo de caixas.
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string, example: veiculos } }
        - { name: status, in: query, schema: { type: string, enum: [verified, pending, all], default: verified } }
        - name: package
          in: query
          description: "Os pacotes (repetido para vários: package=a&package=b). Sem nenhum: todos os do perfil; um de outro perfil não conta."
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: fields.weather, in: query, description: "Exemplo de fields.<campo>.", schema: { type: string, example: rain } }
        - { name: objects.vehicle.type, in: query, description: "Exemplo de objects.<tipo>.<campo>.", schema: { type: string, example: truck } }
      responses:
        "200":
          description: As contagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: string }
                  total: { type: integer }
                  packages: { $ref: "#/components/schemas/Counts" }
                  status: { $ref: "#/components/schemas/Counts" }
                  fields:
                    type: object
                    description: Campo → valor → imagens.
                    additionalProperties: { $ref: "#/components/schemas/Counts" }
                    example: { day_time: { day: 100, night: 50 }, conditions: { no_damage: 140, dirty: 12 } }
                  missing:
                    type: object
                    additionalProperties: { type: integer }
                    description: Campo → imagens sem valor ("Não informado").
                  objects:
                    type: object
                    description: Tipo de objeto → imagens, objetos e campo → valor → objetos.
                    additionalProperties:
                      type: object
                      properties:
                        images: { type: integer }
                        count: { type: integer }
                        fields:
                          type: object
                          additionalProperties: { $ref: "#/components/schemas/Counts" }
                        missing:
                          type: object
                          description: Campo → objetos sem valor ("Não informado").
                          additionalProperties: { type: integer }
                    example: { vehicle: { images: 140, count: 210, fields: { type: { car: 160, truck: 50 } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /images/search:
    get:
      tags: [imagens]
      summary: As imagens de uma pesquisa (paginadas)
      description: |
        As mesmas imagens que o `GET /images/stats` conta, com os mesmos
        parâmetros, numa página (para a tela de pesquisa listar e abrir cada uma).
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string, example: veiculos } }
        - { name: status, in: query, schema: { type: string, enum: [verified, pending, all], default: verified } }
        - name: package
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: fields.weather, in: query, description: "Exemplo de fields.<campo>.", schema: { type: string, example: rain } }
        - { name: objects.vehicle.type, in: query, description: "Exemplo de objects.<tipo>.<campo>.", schema: { type: string, example: truck } }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de imagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Image" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets:
    get:
      tags: [versões]
      summary: Os datasets, com a versão mais nova de cada um
      responses:
        "200":
          description: Lista.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
    post:
      tags: [versões]
      summary: Cria um dataset
      description: |
        Os filtros são os da Pesquisa (`fields.<campo>`, `objects.<tipo>.<campo>`)
        e são conferidos rodando a pesquisa: um campo que o perfil não tem é 400.
      parameters:
        - $ref: "#/components/parameters/XUserRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetInput" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /datasets/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [versões]
      summary: Um dataset
      responses:
        "200":
          description: O dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [versões]
      summary: Troca a descrição, o perfil e a query
      description: O nome não muda (as versões apontam para ele). As versões já criadas não mudam.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetInput" }
      responses:
        "200":
          description: O dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [versões]
      summary: Apaga um dataset
      description: |
        Some a pesquisa salva. Com versões, só com ?versoes=apagar: aí somem
        também as versões e os itens congelados (o histórico). As imagens e a
        anotação delas não são tocadas.
      parameters:
        - { name: versoes, in: query, description: "apagar = apaga junto as versões", schema: { type: string, enum: [apagar] } }
      responses:
        "204": { description: Apagado. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /datasets/{name}/versions:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [versões]
      summary: As versões do dataset, da mais nova para a mais velha
      responses:
        "200":
          description: Lista.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Version" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [versões]
      summary: Congela uma versão nova
      description: |
        As imagens **verificadas** que passam na query agora, com a anotação e as
        caixas das tarefas (as da query; nenhuma = todas). O número é o próximo
        do dataset. Nenhuma imagem passando é 400.
      parameters:
        - $ref: "#/components/parameters/XUserRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, example: "corrigidas 40 placas da coleta de outubro" }
      responses:
        "201":
          description: A versão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets/{name}/versions/{number}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: number, in: path, required: true, description: "O número (3 ou v3), ou atual: o estado de agora, montado na hora e sem gravar (volta com number 0).", schema: { type: string } }
    get:
      tags: [versões]
      summary: Uma versão, com o resumo
      responses:
        "200":
          description: A versão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets/{name}/versions/{number}/items:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: number, in: path, required: true, schema: { type: string } }
    get:
      tags: [versões]
      summary: As imagens congeladas da versão (em ordem de sha1)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/VersionItem" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets/{name}/versions/{number}/stats:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: number, in: path, required: true, description: "3, v3 ou atual (o estado de agora)", schema: { type: string } }
      - { name: package, in: query, description: Repita para vários., schema: { type: array, items: { type: string } }, style: form, explode: true }
      - { name: task, in: query, description: "Tarefas das caixas (repita; sem: as da versão).", schema: { type: array, items: { type: string } }, style: form, explode: true }
    get:
      tags: [versões]
      summary: A pesquisa dentro de uma versão
      description: |
        As mesmas contas do /images/stats e do /boxes/stats, sobre os itens
        congelados da versão (o que a imagem tinha naquele momento). Os filtros
        são os da Pesquisa: fields.<campo>=valor e objects.<tipo>.<campo>=valor.
      responses:
        "200":
          description: As contas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images: { type: object, description: "O mesmo formato da resposta do GET /images/stats." }
                  labels: { type: object, description: "O mesmo formato da resposta do GET /boxes/stats." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets/{name}/diff:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, description: "A versão velha (3 ou v3). Sem: a anterior à `to` (nenhuma, se a `to` é a v1: tudo entra como adicionado).", schema: { type: string } }
      - { name: to, in: query, description: "A versão nova. Sem: a mais nova. atual = o estado de agora, sem gravar (sem from: contra a mais nova).", schema: { type: string } }
      - { name: summary, in: query, description: "1 = só as contas (counts); as listas vêm vazias.", schema: { type: string, enum: ["1"] } }
    get:
      tags: [versões]
      summary: O que mudou entre duas versões
      description: |
        Compara o sha1 e o hash da anotação de cada imagem: só na nova =
        adicionada; só na velha = removida (voltou a pendente ou saiu dos
        filtros); nas duas com hash diferente = alterada.
      responses:
        "200":
          description: O diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /datasets/{name}/versions/{number}/restore:
    post:
      tags: [versões]
      summary: Voltar tudo para a versão (admin)
      description: |
        Todas as imagens que mudaram desde a versão voltam para ela: as
        **alteradas** e as que **saíram** (apagadas, que saem da lixeira;
        reabertas; ou que deixaram de passar na pesquisa). As que **entraram**
        depois não mudam. Uma que falha não para as outras (vai em `failed`).
        Segue até o fim mesmo se o cliente desistir de esperar.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: number, in: path, required: true, schema: { type: string, example: "3" } }
      responses:
        "200":
          description: O que voltou.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  restored: { type: integer }
                  from_trash: { type: integer }
                  added: { type: integer, description: Entraram depois da versão (não mudam). }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        sha1: { type: string }
                        name: { type: string }
                        error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /datasets/{name}/versions/{number}/items/{sha1}/restore:
    post:
      tags: [versões]
      summary: Voltar uma imagem para como estava na versão
      description: |
        Os campos, os objetos e as caixas de cada tarefa da versão voltam para a
        imagem (como verificada; passa pelo perfil do pacote, como uma anotação
        normal). Se a imagem foi apagada depois, sai da **lixeira** (o registro e
        o arquivo). A versão não muda: a próxima registra a volta. O histórico
        da imagem diz "via volta para a vN".
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: number, in: path, required: true, schema: { type: string, example: "3" }, description: "3 ou v3 (o \"atual\" não vale: 400)." }
        - { name: sha1, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Voltou.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha1: { type: string }
                  version: { type: integer }
                  from_trash: { type: boolean, description: Estava apagada e saiu da lixeira. }
                  package: { type: string }
                  file_name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /datasets/{name}/diff/{sha1}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: sha1, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, schema: { type: string } }
      - { name: to, in: query, description: "Também aceita atual.", schema: { type: string } }
    get:
      tags: [versões]
      summary: O que mudou numa imagem entre duas versões
      description: Só o que mudou. Um valor null é "não informado".
      responses:
        "200":
          description: O detalhe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionItemDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound", description: "A imagem não está em nenhuma das duas versões." }
  /boxes/packages:
    get:
      tags: [caixas]
      summary: Em quais tarefas cada pacote tem imagens
      description: |
        Pacote → as tarefas (em ordem) em que ele tem imagens anotadas. Pacote
        sem caixas não aparece. Para a lista de pacotes filtrar e ordenar por
        tarefa sem um pedido por pacote.
      responses:
        "200":
          description: O mapa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    additionalProperties: { type: array, items: { type: string } }
                    example: { rodovia-nov: [capacete, placa], top: [placa] }
  /boxes/stats:
    get:
      tags: [caixas]
      summary: Labels das tarefas nas imagens de uma pesquisa
      description: |
        Conta as caixas de cada label, por tarefa, nas imagens que passam nos
        mesmos filtros do `GET /images/stats` (`profile` obrigatório, `status`,
        `package`, `fields.*`, `objects.*`). `task` repetido para várias; sem
        nenhuma, todas as tarefas.

        `images` (no topo) = imagens da pesquisa; numa tarefa, `images` =
        imagens anotadas nela (com ou sem caixas). Numa label, `boxes` conta
        caixas e `images` conta imagens com pelo menos uma. As labels da tarefa
        que não aparecem vêm com zero.
      parameters:
        - name: task
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: profile, in: query, required: true, schema: { type: string, example: veiculos } }
        - { name: status, in: query, schema: { type: string, enum: [verified, pending, all], default: verified } }
        - name: package
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - { name: fields.weather, in: query, description: "Exemplo de fields.<campo>.", schema: { type: string, example: rain } }
      responses:
        "200":
          description: As contagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images: { type: integer }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task: { type: string }
                        images: { type: integer }
                        boxes: { type: integer }
                        labels:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              images: { type: integer }
                              boxes: { type: integer }
                          example: { helmet: { images: 120, boxes: 180 }, no_helmet: { images: 30, boxes: 34 } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /images/exists:
    post:
      tags: [imagens]
      summary: Quais hashes já existem
      description: O front pergunta antes de subir, para não mandar GB repetido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha1s]
              properties:
                sha1s:
                  type: array
                  maxItems: 1000
                  items: { type: string }
      responses:
        "200":
          description: Separados em existentes e faltando.
          content:
            application/json:
              schema:
                type: object
                properties:
                  existing:
                    type: array
                    items:
                      type: object
                      properties:
                        sha1: { type: string }
                        package: { type: string }
                        status: { type: string }
                  missing:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /images/{sha1}:
    get:
      tags: [imagens]
      summary: Detalhe de uma imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: A imagem (inclui o rascunho salvo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [imagens]
      summary: Salvar rascunho ou verificar
      description: |
        Substitui **toda** a anotação: os campos (`fields`) e os objetos sem
        caixa (`objects`), pelo **perfil de anotação do pacote**.

        - `complete: false`: salva o rascunho (continua pending).
        - `complete: true`: valida tudo (inclusive os campos obrigatórios do
          perfil), calcula o nome (`file_name`) e marca verified.

        O que vem preenchido tem que ser válido no perfil; os erros voltam todos
        juntos em `problems`, cada um com o caminho (ex.: `fields.day_time`,
        `objects[0].plate`). Equipamento e câmera precisam estar cadastrados.

        **O arquivo não muda de nome:** no disco toda imagem é `<sha1>.ext`. No
        perfil `veiculos`, o `file_name` guarda o nome v2 (o que não se sabe vira
        uma posição vazia), que o export usa; nos outros perfis, `<sha1>.ext`.

        Usa optimistic locking: se alguém gravou no meio, responde 409.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationRequest" }
      responses:
        "200":
          description: A imagem atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [imagens]
      summary: Excluir imagem (vai para a lixeira)
      description: |
        Tira a imagem do pacote e guarda na **lixeira**: o registro inteiro
        (coleção `images_trash`) e o arquivo (`lixeira/<sha1>.ext`). As caixas
        saem; o histórico fica. Ela volta por uma versão que a tenha
        (`POST /datasets/{name}/versions/{number}/items/{sha1}/restore`).
        Recusa (409) se outra pessoa está anotando.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha1: { type: string }
                  deleted: { type: boolean }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/reopen:
    post:
      tags: [fila]
      summary: Reabrir para edição
      description: |
        Uma imagem **verificada** volta para **pendente**: o nome v2 (`file_name`)
        sai do banco e os metadados ficam como rascunho. O arquivo não muda. Já fica
        **reservada** para quem pediu (15 min, como na fila), para ninguém pegar
        no meio. Numa pendente, só reserva. As caixas do CVAT não mudam.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A imagem, agora pendente e reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/boxes:
    get:
      tags: [caixas]
      summary: Caixas de uma imagem (em todas as tarefas)
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: As caixas, em pixels da imagem, uma entrada por tarefa (vazio se nenhuma).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoxSet" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/boxes/{task}:
    put:
      tags: [caixas]
      summary: Editar os atributos das caixas de uma imagem numa tarefa
      description: |
        Uma entrada por caixa, na ordem do GET /images/{sha1}/boxes (a posição e
        a label vêm do CVAT e não mudam). Numa caixa cuja label é um tipo de
        objeto com caixa do perfil do pacote, os atributos são conferidos pelos
        campos do tipo; numa label sem tipo, ficam como estavam. Um novo import
        da tarefa sobrescreve a edição (o CVAT é a fonte). A resposta traz o
        novo updated_at (em milissegundos, como fica gravado), que serve de
        version para a próxima edição.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUserRequired"
        - name: task
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, boxes]
              properties:
                version: { type: string, format: date-time, description: "A versão lida: updated_at do BoxSet ou, sem edição, imported_at." }
                boxes:
                  type: array
                  items:
                    type: object
                    properties:
                      attributes: { type: object, additionalProperties: true, example: { color: white } }
      responses:
        "200":
          description: As caixas como ficaram.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxSet" }
        "400":
          description: "Sem X-User, número de caixas diferente, ou atributo inválido (problems, com caminho boxes[i].attributes.<campo>)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string, example: "boxes[1].attributes.color" }
                        msg: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "As caixas mudaram (outra edição ou um novo import): recarregue." }

  /images/{sha1}/file:
    get:
      tags: [imagens]
      summary: O arquivo da imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: Os bytes da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/position:
    get:
      tags: [imagens]
      summary: O número da imagem no pacote ("3 de 3000")
      description: |
        Pela ordem de chegada no pacote (`ingested_at`, desempate pelo sha1), contando
        de 1. O número é fixo: não muda com o status (pendente ou verificada) nem quando
        alguém pula a imagem na fila. A tela de anotação mostra.
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: A posição e o total do pacote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { type: string, example: lote-01 }
                  position: { type: integer, example: 3 }
                  total: { type: integer, example: 3000 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/release:
    post:
      tags: [fila]
      summary: Devolver a imagem para a fila
      description: Só quem está com a imagem consegue liberar. Sem chamar, o prazo vence sozinho em 15 min.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUserRequired"
      responses:
        "204": { description: Liberada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/inspect:
    post:
      tags: [import]
      summary: Raio-x de um CSV (ou do INI de algumas imagens)
      description: |
        Para escrever um perfil novo: colunas, linhas de exemplo e os valores
        distintos de cada coluna. Não precisa de perfil.

        Com `type=jpeg-ini`, mande de 1 a 20 imagens no campo `file`: cada
        imagem vira uma linha, e cada chave do INI embutido (`Secao.Chave`)
        vira uma coluna. Imagens criptografadas são abertas antes. A
        `Assinatura` não aparece.
      parameters:
        - name: type
          in: query
          description: "`jpeg-ini` para ler o INI de imagens em vez de um CSV."
          schema: { type: string, enum: [csv, jpeg-ini], default: csv }
        - name: delimiter
          in: query
          description: Por nome, porque ";" cru é descartado na URL.
          schema: { type: string, enum: [comma, semicolon, tab, pipe], default: comma }
        - name: encoding
          in: query
          schema: { type: string, enum: [utf-8, latin1], default: utf-8 }
      requestBody: { $ref: "#/components/requestBodies/CSVFile" }
      responses:
        "200":
          description: O raio-x.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /import-profiles:
    get:
      tags: [import]
      summary: Listar perfis de import
      description: Os perfis padrão (builtin, ex. splice-ini) vêm primeiro, depois os salvos, em ordem alfabética.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
    post:
      tags: [import]
      summary: Criar perfil de import
      description: Validado antes de salvar; os erros vêm todos juntos.
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /import-profiles/{name}:
    get:
      tags: [import]
      summary: Um perfil
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [import]
      summary: Atualizar perfil
      description: Ex. o ensaio mostrou "Garoa" sem tradução; adicione no map e mande de novo.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [import]
      summary: Renomear perfil
      description: Só troca o nome. Para mudar o conteúdo, use o PUT com o JSON inteiro.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "200":
          description: O perfil, com o nome novo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [import]
      summary: Apagar perfil
      description: Os rascunhos que o perfil já preencheu continuam nas imagens.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /processing/models:
    get:
      tags: [processar]
      summary: Os modelos ligados, com o estado de cada um
      description: |
        Cada modelo responde a um ping (prazo de 1 s). `available: false` =
        o modelo não respondeu (o detalhe vai para o log do servidor); `busy` =
        há um processamento rodando nele.
      responses:
        "200":
          description: Lista (vazia se nenhum modelo estiver configurado).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProcessingModel" } }
  /processing/runs:
    get:
      tags: [processar]
      summary: Os últimos processamentos, mais novos primeiro
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Lista (os que estão rodando vêm com o progresso de agora).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProcessingRun" } }
    post:
      tags: [processar]
      summary: Inicia um processamento
      description: |
        Confere o pedido, cria a tarefa se ela não existir (ou junta as labels
        do modelo que faltam) e solta o processamento em segundo plano. Acompanhe
        por `GET /processing/runs/{id}`. Rodar de novo é seguro: só as caixas do
        próprio modelo são regravadas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessingRunInput" }
      responses:
        "202":
          description: Começou.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Já há um processamento rodando nesse modelo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: O modelo não está respondendo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /processing/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [processar]
      summary: Um processamento, com o progresso e o relatório
      responses:
        "200":
          description: O processamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /processing/runs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [processar]
      summary: Pede para parar um processamento
      description: Para depois da imagem que está no modelo; o que já foi gravado fica.
      responses:
        "200":
          description: Pedido aceito (o status vira `canceled` em instantes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: O processamento já terminou.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    Inactive:
      name: inactive
      in: query
      description: "true: lista os desativados em vez dos ativos."
      schema: { type: boolean, default: false }
    XUser:
      name: X-User
      in: header
      description: Quem está agindo (vai para o histórico). Sem ele, "anonymous".
      schema: { type: string, example: nathan }
    XUserRequired:
      name: X-User
      in: header
      required: true
      description: Quem está anotando.
      schema: { type: string, example: nathan }
    SHA1:
      name: sha1
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{40}$" }
    PackageName:
      name: name
      in: path
      required: true
      schema: { type: string, example: pacote-8003 }
    RegistryName:
      name: name
      in: path
      required: true
      schema: { type: string, example: 8003-MF4739 }
    ProfileName:
      name: name
      in: path
      required: true
      schema: { type: string, example: csv-pg-veiculos }
    SearchQ:
      name: q
      in: query
      description: Contém, sem diferenciar maiúscula. Máx. 64 caracteres.
      schema: { type: string, maxLength: 64 }
    LimitNames:
      name: limit
      in: query
      schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: 8003 MF4739 }
    CSVFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }

  responses:
    Unauthorized:
      description: Sem sessão (faça login).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Só um admin pode fazer isso.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Dado inválido; a mensagem diz o quê.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Não encontrado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicado, imagem com outra pessoa, ou alterada por outra pessoa no meio.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Problems:
      description: Inválido; `problems` diz onde está cada erro (todos de uma vez).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "fields[0].type: tipo \"lista\" não existe (e mais 1)" }
              problems:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string, example: "fields[0].type" }
                    msg: { type: string }
    NameCreated:
      description: Criado; devolve o nome já sanitizado.
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, example: 8003-MF4739 }
    NamePage:
      description: Página de nomes.
      content:
        application/json:
          schema:
            type: object
            properties:
              total: { type: integer }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }

  schemas:
    User:
      type: object
      properties:
        username: { type: string, example: maria.silva, description: O nome no histórico das imagens. }
        email: { type: string, format: email, example: maria.silva@empresa.com.br }
        name: { type: string, example: Maria Silva }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [pending, active, disabled] }
        created_at: { type: string, format: date-time }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time }
        last_login: { type: string, format: date-time }
    DatasetQuery:
      type: object
      properties:
        packages: { type: array, items: { type: string }, description: "Vazio = todos os pacotes do perfil." }
        filters:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: fields.day_time }
              value: { type: string, example: night }
        tasks: { type: array, items: { type: string }, description: "As caixas destas tarefas. Vazio = todas." }
    DatasetInput:
      type: object
      properties:
        name: { type: string, example: motos-noite }
        profile: { type: string, example: capacete-moto }
        description: { type: string }
        query: { $ref: "#/components/schemas/DatasetQuery" }
    Dataset:
      type: object
      properties:
        name: { type: string }
        profile: { type: string }
        description: { type: string }
        query: { $ref: "#/components/schemas/DatasetQuery" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        latest: { allOf: [{ $ref: "#/components/schemas/VersionInfo" }], description: "A versão mais nova (ausente se não há)." }
    VersionInfo:
      type: object
      properties:
        number: { type: integer }
        message: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        images: { type: integer }
    Version:
      type: object
      properties:
        id: { type: string }
        dataset: { type: string }
        number: { type: integer }
        message: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        profile: { type: string }
        query: { $ref: "#/components/schemas/DatasetQuery" }
        tasks: { type: array, items: { type: string }, description: "As tarefas congeladas." }
        summary:
          type: object
          description: O resumo para o dashboard, contado ao criar (as mesmas contas do /images/stats e do /boxes/stats).
          properties:
            images: { type: object, description: "Como a resposta do GET /images/stats." }
            labels: { type: array, items: { type: object }, description: "Como os tasks do GET /boxes/stats." }
    VersionItem:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        file_name: { type: string }
        original_name: { type: string }
        ext: { type: string }
        fields: { type: object, additionalProperties: true }
        objects: { type: array, items: { type: object } }
        boxes:
          type: object
          description: Tarefa → as caixas (com o tamanho da imagem no CVAT).
          additionalProperties:
            type: object
            properties:
              width: { type: integer }
              height: { type: integer }
              boxes: { type: array, items: { type: object } }
        hash: { type: string, description: "O sha1 da anotação: mudou entre versões = a anotação mudou." }
    DiffRef:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        file_name: { type: string }
        original_name: { type: string, description: "O nome com que a imagem subiu (vazio em versões antigas)." }
    VersionDiff:
      type: object
      properties:
        dataset: { type: string }
        from: { allOf: [{ $ref: "#/components/schemas/VersionInfo" }], nullable: true }
        to: { $ref: "#/components/schemas/VersionInfo" }
        added: { type: array, items: { $ref: "#/components/schemas/DiffRef" } }
        removed: { type: array, items: { $ref: "#/components/schemas/DiffRef" } }
        changed: { type: array, items: { $ref: "#/components/schemas/DiffRef" } }
        unchanged: { type: integer }
        counts:
          type: object
          description: Os tamanhos das listas (vêm também com summary=1).
          properties:
            added: { type: integer }
            removed: { type: integer }
            changed: { type: integer }
            unchanged: { type: integer }
    DiffChange:
      type: object
      properties:
        key: { type: string, example: objects.veiculo.cor }
        from: { nullable: true, example: preto }
        to: { nullable: true, example: branco }
    VersionItemDiff:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        file_name: { type: string }
        original_name: { type: string }
        status: { type: string, enum: [added, removed, changed, unchanged] }
        fields: { type: array, items: { $ref: "#/components/schemas/DiffChange" } }
        objects:
          type: array
          description: 'Com mais de um objeto do mesmo tipo, a chave leva a posição: "objects.veiculo[2].cor".'
          items: { $ref: "#/components/schemas/DiffChange" }
        tasks:
          type: array
          items:
            type: object
            properties:
              task: { type: string }
              from: { type: integer, description: "Caixas na versão velha." }
              to: { type: integer }
              labels:
                type: array
                description: Só as labels cuja quantidade mudou.
                items:
                  type: object
                  properties:
                    label: { type: string }
                    from: { type: integer }
                    to: { type: integer }
              edited: { type: boolean, description: "As mesmas quantidades, mas as caixas mudaram (posição, tamanho, atributos)." }
    ProcessingModel:
      type: object
      properties:
        key: { type: string, example: lpr }
        label: { type: string, example: LPR (placas) }
        description: { type: string }
        default_task: { type: string, example: pre-lpr }
        labels: { type: array, items: { type: string }, description: as labels que o modelo gera (entram na tarefa) }
        default_min_score: { type: number, description: o score mínimo se o pedido não disser outro }
        score_help: { type: string, description: a que o score mínimo se aplica }
        available: { type: boolean }
        error: { type: string }
        busy: { type: boolean }
    ProcessingRunInput:
      type: object
      required: [model, packages]
      properties:
        model: { type: string, example: lpr }
        packages: { type: array, items: { type: string }, minItems: 1, maxItems: 200 }
        scope: { type: string, enum: [pending, verified, all], default: pending, description: quais imagens dos pacotes entram }
        task: { type: string, description: "a tarefa das caixas (padrão: a do modelo, ex. pre-lpr)" }
        min_score: { type: number, minimum: 0, maximum: 1, description: "abaixo dele, fica de fora (padrão: o default_min_score do modelo; no LPR vale para os caracteres)" }
    ProcessingRun:
      type: object
      properties:
        id: { type: string, example: 20261124-132000-a1b2c3 }
        model: { type: string }
        packages: { type: array, items: { type: string } }
        scope: { type: string, enum: [pending, verified, all] }
        task: { type: string }
        min_score: { type: number }
        status: { type: string, enum: [running, done, failed, canceled, interrupted] }
        message: { type: string, description: o motivo de um failed }
        total: { type: integer, description: imagens que entraram }
        done: { type: integer, description: já passaram pelo modelo }
        written: { type: integer, description: imagens com caixas gravadas }
        boxes: { type: integer }
        skipped: { type: integer, description: puladas porque as caixas vieram do CVAT ou foram editadas }
        skipped_ids: { type: array, items: { type: string }, description: as primeiras 50 }
        error_count: { type: integer }
        errors:
          type: array
          description: as primeiras 50
          items:
            type: object
            properties:
              sha1: { type: string }
              msg: { type: string }
        started_by: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Counts:
      type: object
      description: Valor → quantidade.
      additionalProperties: { type: integer }
      example: { rain: 30, clear: 120 }
    Error:
      type: object
      properties:
        error: { type: string }

    AnnotationField:
      type: object
      required: [key, type]
      properties:
        key: { type: string, example: day_time, description: "Nome no banco: minúsculas, números e _." }
        label: { type: string, example: Dia/noite }
        type: { type: string, enum: [choice, multi, text, number, bool, datetime, ref] }
        required: { type: boolean, description: Obrigatório para verificar. }
        help: { type: string }
        default: { description: "O valor que a tela já traz numa imagem sem rascunho (tem que ser válido no campo)." }
        repeat: { type: boolean, description: "Só nos campos da imagem: na anotação, a próxima imagem pendente do pacote já vem com o valor da última salva (no veiculos: equipamento, câmera, direção, ângulo e clima)." }
        from_image:
          type: string
          enum: [size]
          description: "Só nos campos da imagem, de lista ou texto: o valor vem do arquivo, não de quem anota. `size` = \"<largura>x<altura>\" (no veiculos: a resolução). O upload já mede; ao salvar (PUT /images/{sha1}) o servidor põe o medido por cima do que veio; numa lista, um tamanho que não é opção deixa o campo vazio. O import (CSV, INI) não preenche."
        options:
          type: array
          description: "choice e multi. `code` é a forma curta no nome do arquivo (se uma opção tem, todas têm)."
          items:
            type: object
            properties:
              value: { type: string, example: night }
              label: { type: string, example: Noite }
              code: { type: string, example: N }
              exclusive: { type: boolean, description: "Só em multi, no máximo uma por campo: a opção \"nenhum dos outros\" (no veiculos, Sem avarias). Se vier junto de outra, sai (o problema marcado ganha)." }
        pattern: { type: string, description: "text: expressão regular do valor inteiro.", example: "[A-Z0-9]{7}" }
        max_len: { type: integer, description: text }
        upper: { type: boolean, description: "text: guarda em maiúsculas." }
        min: { type: number, description: number }
        max: { type: number, description: number }
        integer: { type: boolean, description: number }
        ref: { type: string, enum: [equipment, camera], description: "ref: qual cadastro." }
        from: { type: string, readOnly: true, description: "Herdado: o perfil de onde o campo veio. Ao gravar, os que têm `from` são ignorados (cada perfil guarda só os seus)." }

    BoxRef:
      type: object
      description: A caixa (do CVAT) que é o objeto. As caixas não têm id fixo, então vai a label e a posição.
      required: [task, label]
      properties:
        task: { type: string, example: helmet_detection }
        label: { type: string, example: motorcycle }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }

    AnnotationProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, example: capacete-moto }
        description: { type: string }
        builtin: { type: boolean, readOnly: true }
        extends:
          type: string
          example: veiculos
          description: |
            O perfil pai: este tem todos os campos e tipos de objeto dele, mais os
            seus (um campo do pai não pode ser repetido; um tipo do pai pode ser
            repetido só para acrescentar campos e `box_labels`). A pesquisa e os
            datasets do pai incluem os pacotes dos filhos. Até 5 níveis; sem
            círculo. Um pai com filhos não se apaga.
        lineage:
          type: array
          readOnly: true
          items: { type: string }
          example: [moto, veiculos]
          description: O próprio nome e os dos pais, do mais perto ao mais longe.
        fields:
          type: array
          description: Os campos da imagem (os herdados primeiro, com `from`).
          items: { $ref: "#/components/schemas/AnnotationField" }
        objects:
          type: array
          description: Os tipos de objeto.
          items:
            type: object
            required: [key]
            properties:
              key: { type: string, example: helmet, description: "Com caixa, é a label do CVAT." }
              label: { type: string, example: Capacete }
              box: { type: boolean, description: "Cada objeto é uma caixa (vem do CVAT). Sem caixa, é uma lista na imagem." }
              min: { type: integer, description: Mínimo por imagem para verificar. }
              max: { type: integer, description: "Máximo por imagem (0 = sem limite)." }
              fields:
                type: array
                items: { $ref: "#/components/schemas/AnnotationField" }
              box_labels:
                type: array
                description: |
                  Só nos tipos de lista: as labels de caixa que representam um objeto
                  deste tipo, e o que cada uma já diz dele. Na anotação, o objeto
                  aponta a sua caixa (`box`); o que a label diz preenche os campos
                  vazios, e um valor diferente é 400.
                items:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string, example: motorcycle }
                    fields: { type: object, additionalProperties: true, example: { type: motorcycle } }
                    attributes:
                      type: object
                      additionalProperties: { type: string }
                      example: { color: color }
                      description: |
                        Atributo da caixa (do CVAT) → campo do objeto que é a mesma coisa.
                        Ao ligar a caixa, a tela preenche o campo vazio com o atributo;
                        depois vale o campo do SIDM (a caixa não é reescrita).
                    from: { type: string, readOnly: true }
              from: { type: string, readOnly: true, description: "Herdado: o perfil de onde o tipo veio." }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    AnnotationValues:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
          example: { direction: rear, conditions: [glare] }
        objects:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: vehicle }
              fields: { type: object, additionalProperties: true }
              box: { $ref: "#/components/schemas/BoxRef" }

    ExportProfile:
      type: object
      required: [name, format, split]
      properties:
        name: { type: string, example: yolo-placas-noite }
        description: { type: string }
        format: { type: string, enum: [coco, yolo, voc, images], description: "coco = RF-DETR (layout do Roboflow); voc = Pascal VOC (um .xml por imagem, ao lado dela); images = só as imagens com o nome de saída e um anotacoes.csv (arquivo;sha1;pacote;nome_original;campos do perfil de anotação, em UTF-8 com BOM e ;), sem caixas: não usa tasks, all_tasks nem labels." }
        file_name:
          type: string
          example: "{sha1}{direction}{resolution}{capture_angle}{day_time}{vehicle_type}{image_range}{plate_type}{plate_category}{weather}{condition}{plate}"
          description: |
            Modelo do nome dos arquivos de saída (a extensão é a do arquivo guardado);
            vazio = o nome do SIDM (v2). Campos entre chaves (ver name_fields em
            GET /export-folder-fields?annotation_profile=...); os de lista com código
            saem com o código (no perfil veiculos, o do nome v2: direção F/T,
            resolução 01…10, …). Campo sem valor vira "_" na largura dele. Tem que
            ter {sha1} ou {name}.
        layout:
          type: string
          enum: [split, folders]
          default: split
          description: "split = train/valid/test; folders = árvore de pastas pelos metadados (VOC e images; a divisão só vale com um nível split). No images por divisão com um grupo só (100/0/0), as imagens ficam na raiz."
        folders:
          type: array
          description: Níveis de pasta, na ordem (layout folders).
          items:
            type: object
            required: [field]
            properties:
              field: { type: string, example: direction, description: "Um dos campos de GET /export-folder-fields." }
              names:
                type: object
                additionalProperties: { type: string }
                description: Valor -> nome da pasta (os que faltam usam o nome padrão).
                example: { front: Dianteiro, rear: Traseiro }
              unknown: { type: string, description: "Pasta das imagens sem o metadado (padrão: Desconhecido)." }
        tasks:
          type: array
          items: { type: string }
          example: [parabrisa, placa]
          description: "Tarefas cujas caixas entram, juntas num dataset só (vazio = escolher na hora de exportar; não usado no formato images). A mesma label em duas tarefas vira uma classe só (use labels.rename para separar)."
        all_tasks:
          type: boolean
          description: "Só as imagens anotadas em TODAS as tarefas. Sem isso, uma imagem anotada só numa tarefa entra sem as caixas das outras (e o modelo aprende que o objeto não marcado é fundo)."
        task: { type: string, deprecated: true, description: "Formato antigo (uma tarefa): vira tasks." }
        annotation_profile:
          type: string
          default: veiculos
          description: |
            O perfil de anotação cujos campos os filtros, as pastas e o modelo de
            nome usam. Não limita os pacotes: imagem de pacote de outro perfil só
            não tem os campos (não passa nos filtros; vai para "Desconhecido").
        split:
          type: object
          description: Porcentagens, somam 100. No YOLO, valid > 0.
          properties:
            train: { type: integer, example: 70 }
            valid: { type: integer, example: 15 }
            test: { type: integer, example: 15 }
        packages:
          type: array
          items: { type: string }
          description: Pacotes que entram (vazio = todos).
        filters:
          type: object
          description: |
            Nos campos do perfil de anotação, com os mesmos valores da anotação
            (vazio = qualquer). Os nomes antigos (equipment, day_time,
            vehicle_type...) ainda são aceitos e viram fields/objects.
          properties:
            fields:
              type: object
              additionalProperties: { type: string }
              description: "Campo da imagem -> valor (numa lista, basta conter; número e sim/não como texto: \"2\", \"true\")."
              example: { day_time: night, riders: "2" }
            objects:
              type: object
              description: Tipo de objeto -> campo -> valor. Os campos de um tipo valem para o MESMO objeto.
              additionalProperties:
                type: object
                additionalProperties: { type: string }
              example: { vehicle: { type: truck, color: white } }
            equipment: { type: string }
            camera: { type: string }
            direction: { type: string, example: rear }
            day_time: { type: string, example: night }
            weather: { type: string, example: rain }
            vehicle_type: { type: string }
            vehicle_color: { type: string }
        labels:
          type: object
          properties:
            rename:
              type: object
              additionalProperties: { type: string }
              description: Label do CVAT -> classe. Dois nomes iguais juntam as classes.
              example: { Placa: placa }
            include:
              type: array
              items: { type: string }
              description: Classes que entram, NA ORDEM dos ids (vazio = todas, em ordem alfabética).
              example: [carro, moto, placa]
        builtin: { type: boolean, readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ExportRequest:
      type: object
      required: [profile]
      properties:
        profile:
          description: Nome de um perfil (padrão ou salvo) ou o perfil inteiro.
          oneOf:
            - { type: string, example: rf-detr }
            - { $ref: "#/components/schemas/ExportProfile" }
        tasks:
          type: array
          items: { type: string }
          example: [parabrisa, placa]
          description: Tarefas cujas caixas entram. Valem mais que as do perfil; um dos dois é obrigatório.
        task:
          type: string
          example: capacete
          description: "Uma tarefa só (o formato de antes): o mesmo que tasks com um item."
        version:
          type: object
          description: |
            Baixar uma versão de um dataset: as imagens e a anotação são as
            congeladas nela (mudanças depois não entram). Do perfil valem o
            formato, a divisão, as pastas, os nomes e as labels; os pacotes e
            os filtros dele não. As tarefas têm que estar na versão (sem
            tarefa, entram todas as dela). O zip sai como
            `<dataset>-v<n>-<perfil>.zip`, e o `export_info.json` diz a versão.
          required: [dataset]
          properties:
            dataset: { type: string, example: veiculos-tudo }
            number: { type: integer, minimum: 0, example: 3, description: "0 = o estado atual do dataset (sem gravar)." }

    ExportPreview:
      type: object
      properties:
        profile: { type: string }
        task: { type: string, example: "parabrisa + placa", description: As tarefas juntas, para mostrar. }
        tasks:
          type: array
          items: { type: string }
        all_tasks: { type: boolean }
        format: { type: string }
        layout: { type: string }
        split:
          type: object
          properties:
            train: { type: integer }
            valid: { type: integer }
            test: { type: integer }
        classes:
          type: array
          items: { type: string }
          description: Na ordem dos ids (YOLO começa em 0, COCO em 1).
        total: { type: integer }
        negatives: { type: integer, description: Das imagens do dataset, as sem nenhuma caixa. }
        images:
          type: object
          additionalProperties: { type: integer }
          description: Imagens por grupo (train/valid/test).
        folders:
          type: object
          additionalProperties: { type: integer }
          description: Imagens por pasta (layout folders).
        examples:
          type: array
          items: { type: string }
          description: Os primeiros nomes de arquivo, como vão sair (com a pasta).
        boxes:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por classe.
        skipped:
          type: object
          properties:
            not_annotated: { type: integer, description: Verificadas, mas não anotadas em nenhuma das tarefas. }
            missing_tasks: { type: integer, description: "Com all_tasks: anotadas em só parte das tarefas." }
            without_labels: { type: integer, description: "Com caixas, mas nenhuma das classes escolhidas." }
        packages:
          type: array
          items: { type: string }
        version:
          type: object
          description: Só no export de uma versão.
          properties:
            dataset: { type: string }
            number: { type: integer, description: 0 = o estado atual. }
            id: { type: string }
            message: { type: string }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
            annotation_profile: { type: string }
            images: { type: integer, description: Imagens na versão. }

    Box:
      type: object
      properties:
        label: { type: string, example: placa }
        x: { type: number, description: "Canto superior esquerdo, em pixels." }
        y: { type: number }
        w: { type: number, description: Largura em pixels. }
        h: { type: number, description: Altura em pixels. }
        occluded: { type: boolean }
        rotation: { type: number, description: "Graus, sentido horário (como no CVAT)." }
        attributes:
          type: object
          additionalProperties: true
          description: |
            Atributos criados no CVAT (ex.: { caractere: A }). Se a label é um tipo de
            objeto com caixa do perfil do pacote, seguem os campos dele (conferidos no
            import e na edição); senão, ficam como vieram.

    BoxSet:
      type: object
      properties:
        task: { type: string }
        sha1: { type: string }
        package: { type: string }
        width: { type: integer }
        height: { type: integer }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
        source:
          type: object
          properties:
            tool: { type: string, example: cvat }
            format: { type: string, example: coco }
            file: { type: string, description: Arquivo importado. }
            file_name: { type: string, description: Nome da imagem dentro do arquivo. }
        imported_by: { type: string }
        imported_at: { type: string, format: date-time }
        updated_by: { type: string, description: Quem editou os atributos no SIDM (vazio = como veio do CVAT). }
        updated_at: { type: string, format: date-time, description: "Última edição no SIDM; o reimport zera." }

    BoxImportReport:
      type: object
      properties:
        links: { $ref: "#/components/schemas/LinkResult" }
        dry_run: { type: boolean }
        task: { type: string }
        file: { type: string }
        negatives: { type: boolean }
        file_images: { type: integer, description: Imagens no arquivo. }
        file_boxes: { type: integer, description: Caixas válidas no arquivo. }
        labels:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por label, das imagens que serão gravadas.
        new_labels:
          type: array
          items: { type: string }
          description: Labels que a tarefa não tinha (acrescentadas ao aplicar).
        matched: { type: integer, description: Imagens do arquivo encontradas no SIDM. }
        packages:
          type: object
          additionalProperties: { type: integer }
          description: Das imagens que serão gravadas, quantas por pacote.
        not_found:
          type: array
          items: { type: string }
          description: Até 20 nomes não encontrados.
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
          description: Nome original repetido no banco.
        empty: { type: integer, description: "Encontradas, mas sem caixa no arquivo (gravadas só com negatives=true)." }
        size_mismatch:
          type: array
          items:
            type: object
            properties:
              file_name: { type: string }
              cvat: { type: string, example: 1280x720 }
              sidm: { type: string, example: 1920x1080 }
        will_apply: { type: integer, description: Imagens que serão gravadas. }
        replaced: { type: integer, description: Dessas, as que já estavam na tarefa (substituídas ao aplicar). }
        applied: { type: integer }
        applied_boxes: { type: integer }
        warnings:
          type: array
          items: { type: string }
          description: Caixas ignoradas na leitura do arquivo.
        attribute_problems:
          type: array
          items: { type: string }
          description: "Atributos que ficaram de fora (o tipo de objeto não tem, ou valor inválido), até 50."
        attribute_problem_count: { type: integer }
        missing_required: { type: integer, description: Caixas com atributo obrigatório vazio. }
        untyped_labels:
          type: array
          items: { type: string }
          description: Labels sem tipo com caixa no perfil do pacote (atributos crus).
        edited_replaced: { type: integer, description: Imagens com atributos editados no SIDM que serão sobrescritas. }

    ZipUpload:
      type: object
      properties:
        id: { type: string }
        package: { type: string }
        file_name: { type: string }
        size: { type: integer }
        received: { type: integer, description: Bytes que já chegaram. }
        profile: { type: string }
        status: { type: string, enum: [receiving, processing, done, failed] }
        chunk_size: { type: integer, description: O tamanho de parte que a tela usa. }
        total: { type: integer, description: Imagens no zip. }
        processed: { type: integer }
        created: { type: integer }
        duplicates: { type: integer }
        decrypted: { type: integer }
        with_ini: { type: integer }
        prefilled: { type: integer }
        skipped: { type: integer, description: Arquivos que não são imagem. }
        errors: { type: array, items: { type: string }, description: Até 100. }
        error_count: { type: integer }
        error: { type: string, description: Por que falhou (status failed). }
        running: { type: boolean, description: "Gravando agora; processing sem running = chame finish para continuar." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LinkResult:
      type: object
      description: |
        A ligação das caixas aos objetos. Regras: a ligação que já existe acha a
        caixa de novo (mesma label, IoU >= 0,5); um par só (uma caixa e um
        objeto do tipo sem caixa) se liga; sem nenhum objeto do tipo (nem ligado
        a outra tarefa), cada caixa vira um objeto (só em imagem não
        verificada); o resto fica solto para ligar na tela.
      properties:
        linked: { type: integer, description: Caixas ligadas a um objeto que já existia. }
        created: { type: integer, description: Objetos novos, um por caixa. }
        moved: { type: integer, description: Ligações que já existiam e a caixa mexeu (reimport). }
        loose: { type: integer, description: "Caixas que podiam ser um objeto e ficaram soltas (ambíguo, verificada, máximo do tipo)." }
        images: { type: integer, description: Imagens que mudaram. }
        busy: { type: integer, description: Imagens puladas porque alguém está anotando. }
    TaskBody:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: placa-letras }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
          example: [com_capacete, sem_capacete]
        colors:
          type: object
          description: "Label → cor (#rrggbb). Na edição, ausente = mantém as cores de antes; {} = tira todas. Cores de labels fora da lista são ignoradas."
          additionalProperties: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
          example: { com_capacete: "#6fd6a2" }

    Task:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        colors:
          type: object
          description: Label → cor escolhida (#rrggbb). Label sem cor usa a automática.
          additionalProperties: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskView:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            stats:
              type: object
              properties:
                images: { type: integer, description: Imagens anotadas na tarefa. }
                verified: { type: integer, description: Dessas, as verificadas (entram no export). }
                negatives: { type: integer, description: Anotadas sem nenhuma caixa. }
                boxes: { type: integer }
                labels:
                  type: object
                  additionalProperties: { type: integer }
                packages:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      images: { type: integer }
                      verified: { type: integer }

    RegistryReport:
      type: object
      properties:
        name: { type: string, description: O nome final. }
        renamed: { type: boolean }
        merged: { type: boolean, description: O nome novo já existia e os dois foram fundidos. }
        active: { type: boolean }
        pending_updated: { type: integer }
        verified_renamed: { type: integer, description: Verificadas cujo arquivo foi renomeado. }
        failed:
          type: array
          items: { type: string }
          description: sha1 das imagens que não deu para renomear agora.
        complete: { type: boolean, description: "false: repita o pedido para terminar." }

    Image:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        status: { type: string, enum: [pending, verified] }
        original_name: { type: string }
        file_name: { type: string, description: "Nome v2, quando verified." }
        path: { type: string, description: Relativo à pasta de imagens do servidor. }
        ext: { type: string }
        size: { type: integer }
        encryption: { type: string, description: "Se o arquivo chegou criptografado, o formato aberto (ex. rc4-legacy)." }
        pattern_version: { type: string, description: '"v2" quando o file_name é o nome v2 (verificada no perfil veiculos).' }
        fields:
          type: object
          additionalProperties: true
          description: Os campos da imagem, pelo perfil de anotação do pacote.
          example: { equipment: 8003-MF4739, direction: rear, day_time: night, conditions: [glare], captured_at: "2026-09-03T11:25:23Z" }
        objects:
          type: array
          description: Os objetos sem caixa (ex. os veículos).
          items:
            type: object
            properties:
              type: { type: string, example: vehicle }
              fields: { type: object, additionalProperties: true, example: { plate: ABC1D23, type: truck, color: white } }
        ini:
          type: array
          description: O INI embutido no arquivo, na ordem original (sem a assinatura).
          items: { $ref: "#/components/schemas/INIEntry" }
        claimed_by: { type: string, description: Quem está anotando agora. }
        claimed_until: { type: string, format: date-time }
        queued_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    INIEntry:
      type: object
      properties:
        section: { type: string, example: NMetrologico }
        key: { type: string, example: Placa }
        value: { type: string, example: GGB5H24 }

    AnnotationRequest:
      allOf:
        - $ref: "#/components/schemas/AnnotationValues"
        - type: object
          properties:
            complete:
              type: boolean
              description: "false: rascunho. true: verifica (cobra os obrigatórios) e calcula o nome (file_name)."
      example:
        fields:
          equipment: 8003-MF4739
          camera: hikvision-233
          direction: front
          resolution: 1920x1080
          day_time: day
          conditions: [no_damage]
          captured_at: "2026-09-03T08:25:23-03:00"
        objects:
          - { type: vehicle, fields: { plate: ABC1D23, plate_type: mercosul, plate_category: private, type: truck, color: white } }
        complete: true

    PackageBody:
      type: object
      properties:
        name: { type: string, example: Noturnas Setembro }
        profile: { type: string, example: veiculos, description: Perfil de anotação. }

    PackageSummary:
      type: object
      properties:
        name: { type: string }
        profile: { type: string, description: O perfil de anotação do pacote., example: veiculos }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        total: { type: integer }
        verified: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer, description: Pendentes que alguém está anotando agora. }

    UploadResult:
      type: object
      properties:
        file: { type: string }
        sha1: { type: string }
        status: { type: string, enum: [created, duplicate, error] }
        existing_package: { type: string, description: "Se duplicate: onde ela já está." }
        decrypted: { type: string, description: "Formato de criptografia que foi aberto (ex. rc4-legacy)." }
        ini: { type: boolean, description: O arquivo tinha INI embutido. }
        prefilled: { type: boolean, description: "Nome v2 válido ou perfil de INI aplicado." }
        warnings:
          type: array
          items: { type: string }
          description: Ex. valor do INI sem tradução no perfil. Não impede o upload.
        error: { type: string }

    FieldRule:
      type: object
      description: Use `column`, `value` OU `template`.
      properties:
        column: { type: string, description: "No CSV, o nome da coluna. No INI, \"Secao.Chave\"." }
        value: { type: string, description: Valor fixo para o arquivo todo. }
        template:
          type: string
          description: Junta colunas. Se alguma estiver vazia, o resultado é vazio.
          example: "{Metrologico.Data} {Metrologico.Hora}.{Metrologico.Milisegundo}"
        map:
          type: object
          description: |
            Valor de origem → nosso valor (um valor aceito pelo campo). Ignora
            maiúscula. Sem map, um campo de lista aceita o valor, o código ou o
            nome da opção na tela; número aceita vírgula decimal; sim/não aceita
            true/false, sim/não, 1/0.
          additionalProperties: { type: string }
        split: { type: string, description: "Só em campo de vários valores (multi), como conditions." }
        time_column: { type: string, description: "Só em data e hora, junto com column: a hora em outra coluna (no INI, \"Metrologico.Hora\")." }
        ms_column: { type: string, description: "Só em data e hora, junto com column: o milissegundo em outra coluna (número de ms: 12 = 12 ms)." }
        date_order:
          type: string
          enum: [dmy, mdy]
          description: "Só em data e hora: dmy (padrão, 03/04/2026 = 3 de abril) ou mdy. Uma data que começa pelo ano é sempre ano-mês-dia."
        timezone: { type: string, example: America/Sao_Paulo, description: "Só em data e hora: o fuso de quando o texto não traz um (vazio = UTC)." }
        date_format:
          type: string
          description: |
            Opcional (perfis antigos): layout do Go, ex. 02/01/2006 15:04:05.
            Tentado primeiro; se não bater, vale a leitura automática: data
            DD/MM/AAAA, DD-MM-AAAA, DD.MM.AAAA, DD/MM/AA, AAAA-MM-DD ou AAAAMMDD;
            hora HH:MM[:SS[.fff]], HHMMSS ou com AM/PM; ISO com fuso; epoch em s
            ou ms. Vários valores ("10:03:24;10:03:24"): vale o primeiro. A data
            tem que estar entre 2000 e amanhã.

    Profile:
      type: object
      required: [name, reader, match]
      properties:
        name: { type: string, example: csv-pg-veiculos }
        description: { type: string }
        annotation_profile:
          type: string
          default: veiculos
          description: |
            O perfil de anotação que este perfil preenche: as chaves de fields e
            de objects são as dele, e os valores dos map são conferidos contra
            ele. Num pacote de outro perfil, o que ele não tem fica de fora e é
            listado (outside_profile).
        reader:
          type: object
          properties:
            type: { type: string, enum: [csv, jpeg-ini] }
            delimiter: { type: string, example: ";" }
            encoding: { type: string, enum: [utf-8, latin1] }
        match:
          type: object
          description: Só no CSV (no INI a imagem é a própria origem).
          properties:
            column: { type: string, example: imagem_nome }
            by: { type: string, enum: [original_name, sha1] }
        fields:
          type: object
          description: "Campos da imagem do perfil de anotação (no veiculos: equipment, camera, direction, resolution, capture_angle, day_time, image_range, weather, conditions, captured_at)."
          additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        objects:
          type: object
          description: Tipo de objeto sem caixa do perfil de anotação (ex. vehicle) -> como achar os objetos dele.
          additionalProperties:
            type: object
            required: [mode, fields]
            properties:
              mode: { type: string, enum: [single, row, columns], description: "single: um objeto por imagem (o caso do INI); row: um por linha; columns: colunas numeradas." }
              max: { type: integer, description: Só no modo columns. }
              key: { type: string, example: plate, description: "O campo que diz que o objeto existe (sem valor nele, não há objeto). Vazio: existe se algum campo de coluna tem valor." }
              fields:
                type: object
                description: "Campos do tipo de objeto (no vehicle: plate, plate_type, plate_category, type, color). No modo columns, use {n} no nome da coluna."
                additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        vehicles:
          type: object
          deprecated: true
          description: "Formato antigo: o mesmo que objects.vehicle com key plate. Aceito na entrada; volta como objects."
        builtin:
          type: boolean
          readOnly: true
          description: Perfil padrão que vem com o SIDM (ex. splice-ini). Fica no código, não pode ser criado, alterado, renomeado nem apagado; para mudar, copie com outro nome.
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Inspection:
      type: object
      properties:
        rows: { type: integer }
        columns:
          type: array
          items: { type: string }
        sample:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        distinct:
          type: object
          additionalProperties:
            type: object
            properties:
              total: { type: integer }
              truncated: { type: boolean }
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    count: { type: integer }

    ImportReport:
      type: object
      properties:
        dry_run: { type: boolean }
        package: { type: string }
        profile: { type: string }
        overwrite: { type: boolean }
        rows: { type: integer, description: Linhas lidas (vazias são ignoradas). }
        records: { type: integer, description: Imagens descritas (linhas agrupadas). }
        unmapped:
          type: object
          description: Valores sem tradução, por campo, com a contagem. É o que falta no perfil.
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
          example: { weather: { Garoa: 12 } }
        missing_key: { type: integer }
        without_ini: { type: integer, description: "Perfil jpeg-ini: imagens pendentes sem INI embutido." }
        errors:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: "No import de INI: o sha1 da imagem." }
              line: { type: integer }
              field: { type: string }
              error: { type: string }
        error_count: { type: integer }
        matched: { type: integer }
        not_found:
          type: array
          items: { type: string }
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
        skipped_verified: { type: integer }
        skipped_claimed: { type: integer }
        unchanged: { type: integer }
        applied: { type: integer, description: "No ensaio: quantas seriam aplicadas." }
        conflicts: { type: integer }
        new_equipments:
          type: array
          items: { type: string }
        new_cameras:
          type: array
          items: { type: string }
        invalid_names:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              field: { type: string }
              value: { type: string }
              error: { type: string }
        outside_profile:
          type: array
          description: Valores que o perfil de anotação do pacote não tem ou não aceita (ficam de fora; até 100).
          items: { type: string, example: "linha 2: weather: o perfil capacete-moto não tem este campo" }
        outside_profile_count: { type: integer }
