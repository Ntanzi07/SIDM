openapi: 3.0.3
info:
  title: SIDM API
  version: "1.0"
  description: |
    Controle e anotação de imagens de veículos.

    **Fluxo:** criar pacote → upload → fila de anotação (`/next`) → verificar (`PUT` com `complete: true`).

    **v1 interna, sem login:** quem está agindo vai no header `X-User`. Rode só na rede interna.

    **Listagens** respondem sempre `{"total": N, "items": [...]}`, com `limit` e `skip` para paginar.

    **Erros** respondem sempre `{"error": "mensagem"}`.

tags:
  - name: sistema
  - name: cadastros
    description: Equipamentos e câmeras.
  - name: pacotes
  - name: imagens
  - name: fila
    description: Fila de trabalho compartilhada (várias pessoas anotando o mesmo pacote).
  - name: import
    description: Import de metadados por CSV, usando perfis.
  - name: export
    description: |
      Datasets de treino (RF-DETR / YOLO). Entram as imagens **verificadas** e
      **anotadas na tarefa** escolhida que passam nos filtros do perfil (as
      anotadas sem nenhuma caixa entram como negativas). A divisão
      train/valid/test é **fixa por imagem** (pelo sha1). Perfis padrão:
      `rf-detr` e `yolo`.
  - name: caixas
    description: |
      Caixas (bounding boxes) anotadas no CVAT, por **tarefa** (ex.: `capacete`,
      `placa-letras`): a mesma imagem pode estar em várias tarefas sem uma
      sobrescrever a outra. O SIDM não desenha caixas: manda as imagens para o
      CVAT (cvat.zip) e importa o export COCO 1.0 de volta, na tarefa.

paths:
  /health:
    get:
      tags: [sistema]
      summary: Saúde do serviço
      description: Responde `ok` se o Mongo está acessível.
      responses:
        "200":
          description: Tudo certo.
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Mongo indisponível.

  /codes:
    get:
      tags: [cadastros]
      summary: Tabelas fixas do padrão v2
      description: |
        Para os dropdowns: código → valor, por campo. Equipamentos e câmeras
        **não** vêm aqui (têm busca própria: `/equipments` e `/cameras`).
      responses:
        "200":
          description: Tabelas por campo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
              example:
                day_time: { D: day, N: night }
                weather: { S: clear, C: rain, N: fog }

  /equipments:
    get:
      tags: [cadastros]
      summary: Buscar equipamentos (autocomplete)
      description: Busca por "contém", sem diferenciar maiúscula. `mf47` encontra `8003-MF4739`.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar equipamento
      description: O nome é sanitizado (espaço vira `-`; só `A-Z a-z 0-9 -`).
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras:
    get:
      tags: [cadastros]
      summary: Buscar câmeras (autocomplete)
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar câmera
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /equipments/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar equipamento
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o **arquivo é renomeado** para o novo nome v2. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir equipamento
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /cameras/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar câmera
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o **arquivo é renomeado** para o novo nome v2. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir câmera
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages:
    get:
      tags: [pacotes]
      summary: Listar pacotes com progresso
      description: Mais novos primeiro.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de pacotes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackageSummary" }
    post:
      tags: [pacotes]
      summary: Criar pacote
      description: O nome vira nome de pasta no servidor, por isso é sanitizado. A pasta é criada na hora.
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /packages/{name}:
    patch:
      tags: [pacotes]
      summary: Renomear pacote
      description: Renomeia a pasta no servidor, o cadastro e o caminho de todas as imagens. O nome dos arquivos não muda.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "200":
          description: Renomeado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [pacotes]
      summary: Excluir pacote (IRREVERSÍVEL)
      description: |
        Apaga o pacote, **todas as imagens dele** (banco e arquivos no disco) e o
        histórico. Para confirmar, repita o nome do pacote em `confirm`.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - name: confirm
          in: query
          required: true
          description: O nome do pacote, de novo.
          schema: { type: string }
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted_images: { type: integer }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/cvat.zip:
    get:
      tags: [caixas]
      summary: Imagens do pacote para o CVAT
      description: |
        Um zip com as imagens do pacote, com os nomes guardados no SIDM (que
        começam pelo sha1). Use-o para criar a task no CVAT: assim, o export de
        volta casa com as imagens sem ambiguidade. Imagens que não puderam ser
        incluídas são listadas em `FALTANDO.txt` dentro do zip.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/boxes:
    get:
      tags: [caixas]
      summary: Tarefas em que o pacote tem imagens anotadas
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Por tarefa, imagens do pacote anotadas nela e total de caixas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { type: string }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task: { type: string }
                        images: { type: integer }
                        boxes: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      tags: [caixas]
      summary: Tarefas de anotação (com o resumo de cada uma)
      responses:
        "200":
          description: Todas as tarefas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskView" }
    post:
      tags: [caixas]
      summary: Criar tarefa
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "201":
          description: Criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: capacete }
    get:
      tags: [caixas]
      summary: Uma tarefa, com os pacotes e as caixas por label
      responses:
        "200":
          description: A tarefa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [caixas]
      summary: Atualizar tarefa
      description: Mudar o nome leva junto as caixas e os perfis de export que apontam para ela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "200":
          description: Atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [caixas]
      summary: Apagar tarefa e as caixas dela
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  images: { type: integer, description: Imagens que tinham caixas na tarefa. }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{name}/import:
    post:
      tags: [caixas]
      summary: Importar caixas do CVAT (COCO 1.0) na tarefa
      description: |
        Mande o export da task do CVAT no formato **COCO 1.0** (o zip, ou só o
        `.json`). Por padrão é um **ensaio** (`dry_run=true`): nada é gravado.

        As imagens são procuradas no **banco todo** (qualquer pacote), pelo nome
        do arquivo (sem pasta): se começa pelo sha1, é por ele; senão, pelo
        nome original, só se for único no banco.

        - Imagens **sem caixa** no arquivo: com `negatives=false` (padrão) não
          são mexidas (o CVAT exporta todas as imagens da task, inclusive as não
          anotadas). Com `negatives=true` entram como anotadas e vazias: use só
          com a task do CVAT toda anotada.
        - Imagens cujo **tamanho** no CVAT difere do arquivo guardado são puladas.
        - Reimportar **substitui** as caixas da imagem nesta tarefa (as outras
          tarefas não mudam).
        - Labels que a tarefa ainda não tem são **acrescentadas** a ela.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XUser"
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: negatives
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "Zip do CVAT ou o .json (COCO 1.0)." }
      responses:
        "200":
          description: Relatório.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export-profiles:
    get:
      tags: [export]
      summary: Listar perfis de export
      description: Os padrões (`rf-detr`, `yolo`, com `builtin` true) e os salvos.
      responses:
        "200":
          description: Perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportProfile" }
    post:
      tags: [export]
      summary: Criar perfil de export
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /export-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: rf-detr }
    get:
      tags: [export]
      summary: Um perfil de export
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [export]
      summary: Atualizar perfil de export
      description: Os perfis padrão não podem ser alterados (salve uma cópia com outro nome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [export]
      summary: Apagar perfil de export
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/preview:
    post:
      tags: [export]
      summary: Prévia do dataset
      description: O que vai sair, sem gerar o zip. `profile` é o nome de um perfil ou um perfil inteiro (montado na tela, sem salvar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: Prévia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/download:
    post:
      tags: [export]
      summary: Baixar o dataset (zip)
      description: |
        Gera o zip enquanto baixa. Também aceita o pedido como formulário
        (`application/x-www-form-urlencoded`, campo `request` com o mesmo JSON),
        para o navegador salvar direto no disco.

        - **coco** (RF-DETR): `train/`, `valid/`, `test/`, cada um com as imagens e
          `_annotations.coco.json`.
        - **yolo** (Ultralytics): `images/{train,val,test}`, `labels/{train,val,test}`
          e `data.yaml`.

        Sempre vai junto um `export_info.json` (perfil, data, contagens). Caixas
        rotacionadas viram o menor retângulo reto que as contém.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request: { type: string, description: 'O mesmo JSON, ex.: {"profile":"yolo"}' }
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/next:
    post:
      tags: [fila]
      summary: Pegar a próxima imagem da fila
      description: |
        Entrega a imagem pendente livre mais antiga do pacote e reserva para o
        usuário por 15 minutos. Recarregar devolve a mesma imagem. Duas pessoas
        nunca recebem a mesma imagem.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUserRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skip:
                  type: string
                  description: sha1 da imagem atual, para pular (ela vai para o fim da fila).
      responses:
        "200":
          description: A imagem, já reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "204": { description: Fila vazia. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/import:
    post:
      tags: [import]
      summary: Importar um CSV para os rascunhos do pacote
      description: |
        Casa cada linha do CSV com uma imagem do pacote e preenche o **rascunho**
        (nunca verifica). Equipamentos e câmeras novos são cadastrados.

        **O padrão é ensaio**: só grava com `dry_run=false`.

        Com um perfil do tipo `jpeg-ini`, **não mande arquivo**: o import usa o INI
        já guardado de cada imagem pendente do pacote.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUser"
        - name: profile
          in: query
          required: true
          schema: { type: string }
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: overwrite
          in: query
          description: "false: só preenche campos vazios. true: o CSV substitui o rascunho."
          schema: { type: boolean, default: false }
      requestBody:
        required: false
        description: O CSV (não precisa com perfil jpeg-ini).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Relatório do import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Arquivo maior que 20 MB. }

  /images:
    get:
      tags: [imagens]
      summary: Buscar imagens
      description: |
        Filtros de veículo valem para o **mesmo** veículo: "caminhão branco" não
        traz uma imagem com um caminhão preto e um carro branco.
      parameters:
        - { name: package, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, verified] } }
        - { name: equipment, in: query, schema: { type: string } }
        - { name: camera, in: query, schema: { type: string } }
        - { name: day_time, in: query, schema: { type: string } }
        - { name: weather, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string } }
        - { name: vehicle_type, in: query, schema: { type: string } }
        - { name: vehicle_color, in: query, schema: { type: string } }
        - { name: plate, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de imagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Image" }
    post:
      tags: [imagens]
      summary: Upload de imagens para um pacote
      description: |
        Imagem repetida (mesmo conteúdo) que já está em outro pacote é **pulada**,
        e o resto do lote segue.

        O INI que o equipamento grava **dentro** do JPEG é sempre guardado no banco
        (menos a assinatura). Com `profile` (do tipo `jpeg-ini`), ele também
        pré-preenche o rascunho. O arquivo nunca é alterado.

        **Arquivos criptografados** pelo equipamento são abertos sozinhos: o
        formato RC4 legado (qualquer extensão; vira `.jpg`). O hash, o INI e o
        arquivo guardado são os do original aberto. O formato PGP ainda é recusado.
      parameters:
        - name: package
          in: query
          required: true
          schema: { type: string }
        - name: profile
          in: query
          description: Perfil do tipo jpeg-ini, opcional.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Resultado de cada arquivo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/exists:
    post:
      tags: [imagens]
      summary: Quais hashes já existem
      description: O front pergunta antes de subir, para não mandar GB repetido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha1s]
              properties:
                sha1s:
                  type: array
                  maxItems: 1000
                  items: { type: string }
      responses:
        "200":
          description: Separados em existentes e faltando.
          content:
            application/json:
              schema:
                type: object
                properties:
                  existing:
                    type: array
                    items:
                      type: object
                      properties:
                        sha1: { type: string }
                        package: { type: string }
                        status: { type: string }
                  missing:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /images/{sha1}:
    get:
      tags: [imagens]
      summary: Detalhe de uma imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: A imagem (inclui o rascunho salvo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [imagens]
      summary: Salvar rascunho ou verificar
      description: |
        Substitui **todos** os campos de anotação.

        - `complete: false`: salva o rascunho (continua pending, não renomeia).
        - `complete: true`: valida tudo, renomeia para o padrão v2 e marca verified.

        **Nenhum campo é obrigatório.** O que a imagem não tem, ou não dá para
        conferir (sem data, placa ilegível, câmera desconhecida, nenhum veículo),
        fica vazio (`""`, `null` ou lista vazia) e vira uma **posição vazia** no
        nome v2. O que vem preenchido tem que ser válido (código existente, placa
        com 7 caracteres, equipamento/câmera cadastrados).

        Usa optimistic locking: se alguém gravou no meio, responde 409.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationRequest" }
      responses:
        "200":
          description: A imagem atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [imagens]
      summary: Excluir imagem (IRREVERSÍVEL)
      description: Apaga o registro, o histórico e o arquivo. Recusa (409) se outra pessoa está anotando.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha1: { type: string }
                  deleted: { type: boolean }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/reopen:
    post:
      tags: [fila]
      summary: Reabrir para edição
      description: |
        Uma imagem **verificada** volta para **pendente**: o arquivo perde o nome v2
        (volta a ser `<sha1>.ext`) e os metadados ficam como rascunho. Já fica
        **reservada** para quem pediu (15 min, como na fila), para ninguém pegar
        no meio. Numa pendente, só reserva. As caixas do CVAT não mudam.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A imagem, agora pendente e reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/boxes:
    get:
      tags: [caixas]
      summary: Caixas de uma imagem (em todas as tarefas)
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: As caixas, em pixels da imagem, uma entrada por tarefa (vazio se nenhuma).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoxSet" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/file:
    get:
      tags: [imagens]
      summary: O arquivo da imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: Os bytes da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/release:
    post:
      tags: [fila]
      summary: Devolver a imagem para a fila
      description: Só quem está com a imagem consegue liberar. Sem chamar, o prazo vence sozinho em 15 min.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUserRequired"
      responses:
        "204": { description: Liberada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/inspect:
    post:
      tags: [import]
      summary: Raio-x de um CSV (ou do INI de algumas imagens)
      description: |
        Para escrever um perfil novo: colunas, linhas de exemplo e os valores
        distintos de cada coluna. Não precisa de perfil.

        Com `type=jpeg-ini`, mande de 1 a 20 imagens no campo `file`: cada
        imagem vira uma linha, e cada chave do INI embutido (`Secao.Chave`)
        vira uma coluna. Imagens criptografadas são abertas antes. A
        `Assinatura` não aparece.
      parameters:
        - name: type
          in: query
          description: "`jpeg-ini` para ler o INI de imagens em vez de um CSV."
          schema: { type: string, enum: [csv, jpeg-ini], default: csv }
        - name: delimiter
          in: query
          description: Por nome, porque ";" cru é descartado na URL.
          schema: { type: string, enum: [comma, semicolon, tab, pipe], default: comma }
        - name: encoding
          in: query
          schema: { type: string, enum: [utf-8, latin1], default: utf-8 }
      requestBody: { $ref: "#/components/requestBodies/CSVFile" }
      responses:
        "200":
          description: O raio-x.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /import-profiles:
    get:
      tags: [import]
      summary: Listar perfis de import
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
    post:
      tags: [import]
      summary: Criar perfil de import
      description: Validado antes de salvar; os erros vêm todos juntos.
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /import-profiles/{name}:
    get:
      tags: [import]
      summary: Um perfil
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [import]
      summary: Atualizar perfil
      description: Ex. o ensaio mostrou "Garoa" sem tradução; adicione no map e mande de novo.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [import]
      summary: Renomear perfil
      description: Só troca o nome. Para mudar o conteúdo, use o PUT com o JSON inteiro.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "200":
          description: O perfil, com o nome novo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [import]
      summary: Apagar perfil
      description: Os rascunhos que o perfil já preencheu continuam nas imagens.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    XUser:
      name: X-User
      in: header
      description: Quem está agindo (vai para o histórico). Sem ele, "anonymous".
      schema: { type: string, example: nathan }
    XUserRequired:
      name: X-User
      in: header
      required: true
      description: Quem está anotando.
      schema: { type: string, example: nathan }
    SHA1:
      name: sha1
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{40}$" }
    PackageName:
      name: name
      in: path
      required: true
      schema: { type: string, example: pacote-8003 }
    RegistryName:
      name: name
      in: path
      required: true
      schema: { type: string, example: 8003-MF4739 }
    ProfileName:
      name: name
      in: path
      required: true
      schema: { type: string, example: csv-pg-veiculos }
    SearchQ:
      name: q
      in: query
      description: Contém, sem diferenciar maiúscula. Máx. 64 caracteres.
      schema: { type: string, maxLength: 64 }
    LimitNames:
      name: limit
      in: query
      schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: 8003 MF4739 }
    CSVFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }

  responses:
    BadRequest:
      description: Dado inválido; a mensagem diz o quê.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Não encontrado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicado, imagem com outra pessoa, ou alterada por outra pessoa no meio.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NameCreated:
      description: Criado; devolve o nome já sanitizado.
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, example: 8003-MF4739 }
    NamePage:
      description: Página de nomes.
      content:
        application/json:
          schema:
            type: object
            properties:
              total: { type: integer }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    ExportProfile:
      type: object
      required: [name, format, split]
      properties:
        name: { type: string, example: yolo-placas-noite }
        description: { type: string }
        format: { type: string, enum: [coco, yolo], description: "coco = RF-DETR (layout do Roboflow)." }
        task: { type: string, description: "Tarefa de anotação (vazio = escolher na hora de exportar)." }
        split:
          type: object
          description: Porcentagens, somam 100. No YOLO, valid > 0.
          properties:
            train: { type: integer, example: 70 }
            valid: { type: integer, example: 15 }
            test: { type: integer, example: 15 }
        packages:
          type: array
          items: { type: string }
          description: Pacotes que entram (vazio = todos).
        filters:
          type: object
          description: Mesmos valores da anotação (vazio = qualquer).
          properties:
            equipment: { type: string }
            camera: { type: string }
            direction: { type: string, example: rear }
            day_time: { type: string, example: night }
            weather: { type: string, example: rain }
            vehicle_type: { type: string }
            vehicle_color: { type: string }
        labels:
          type: object
          properties:
            rename:
              type: object
              additionalProperties: { type: string }
              description: Label do CVAT -> classe. Dois nomes iguais juntam as classes.
              example: { Placa: placa }
            include:
              type: array
              items: { type: string }
              description: Classes que entram, NA ORDEM dos ids (vazio = todas, em ordem alfabética).
              example: [carro, moto, placa]
        builtin: { type: boolean, readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ExportRequest:
      type: object
      required: [profile]
      properties:
        profile:
          description: Nome de um perfil (padrão ou salvo) ou o perfil inteiro.
          oneOf:
            - { type: string, example: rf-detr }
            - { $ref: "#/components/schemas/ExportProfile" }
        task:
          type: string
          example: capacete
          description: Tarefa cujas caixas entram. Vale mais que a do perfil; um dos dois é obrigatório.

    ExportPreview:
      type: object
      properties:
        profile: { type: string }
        task: { type: string }
        format: { type: string }
        split:
          type: object
          properties:
            train: { type: integer }
            valid: { type: integer }
            test: { type: integer }
        classes:
          type: array
          items: { type: string }
          description: Na ordem dos ids (YOLO começa em 0, COCO em 1).
        total: { type: integer }
        negatives: { type: integer, description: Das imagens do dataset, as sem nenhuma caixa. }
        images:
          type: object
          additionalProperties: { type: integer }
          description: Imagens por grupo (train/valid/test).
        boxes:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por classe.
        skipped:
          type: object
          properties:
            not_annotated: { type: integer, description: Verificadas, mas não anotadas na tarefa. }
            without_labels: { type: integer, description: "Com caixas, mas nenhuma das classes escolhidas." }
        packages:
          type: array
          items: { type: string }

    Box:
      type: object
      properties:
        label: { type: string, example: placa }
        x: { type: number, description: "Canto superior esquerdo, em pixels." }
        y: { type: number }
        w: { type: number, description: Largura em pixels. }
        h: { type: number, description: Altura em pixels. }
        occluded: { type: boolean }
        rotation: { type: number, description: "Graus, sentido horário (como no CVAT)." }
        attributes:
          type: object
          additionalProperties: true
          description: "Atributos criados no CVAT (ex.: { caractere: A })."

    BoxSet:
      type: object
      properties:
        task: { type: string }
        sha1: { type: string }
        package: { type: string }
        width: { type: integer }
        height: { type: integer }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
        source:
          type: object
          properties:
            tool: { type: string, example: cvat }
            format: { type: string, example: coco }
            file: { type: string, description: Arquivo importado. }
            file_name: { type: string, description: Nome da imagem dentro do arquivo. }
        imported_by: { type: string }
        imported_at: { type: string, format: date-time }

    BoxImportReport:
      type: object
      properties:
        dry_run: { type: boolean }
        task: { type: string }
        file: { type: string }
        negatives: { type: boolean }
        file_images: { type: integer, description: Imagens no arquivo. }
        file_boxes: { type: integer, description: Caixas válidas no arquivo. }
        labels:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por label, das imagens que serão gravadas.
        new_labels:
          type: array
          items: { type: string }
          description: Labels que a tarefa não tinha (acrescentadas ao aplicar).
        matched: { type: integer, description: Imagens do arquivo encontradas no SIDM. }
        packages:
          type: object
          additionalProperties: { type: integer }
          description: Das imagens que serão gravadas, quantas por pacote.
        not_found:
          type: array
          items: { type: string }
          description: Até 20 nomes não encontrados.
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
          description: Nome original repetido no banco.
        empty: { type: integer, description: "Encontradas, mas sem caixa no arquivo (gravadas só com negatives=true)." }
        size_mismatch:
          type: array
          items:
            type: object
            properties:
              file_name: { type: string }
              cvat: { type: string, example: 1280x720 }
              sidm: { type: string, example: 1920x1080 }
        will_apply: { type: integer, description: Imagens que serão gravadas. }
        replaced: { type: integer, description: Dessas, as que já estavam na tarefa (substituídas ao aplicar). }
        applied: { type: integer }
        applied_boxes: { type: integer }
        warnings:
          type: array
          items: { type: string }
          description: Caixas ignoradas na leitura do arquivo.

    TaskBody:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: placa-letras }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
          example: [com_capacete, sem_capacete]

    Task:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskView:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            stats:
              type: object
              properties:
                images: { type: integer, description: Imagens anotadas na tarefa. }
                verified: { type: integer, description: Dessas, as verificadas (entram no export). }
                negatives: { type: integer, description: Anotadas sem nenhuma caixa. }
                boxes: { type: integer }
                labels:
                  type: object
                  additionalProperties: { type: integer }
                packages:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      images: { type: integer }
                      verified: { type: integer }

    RegistryReport:
      type: object
      properties:
        name: { type: string, description: O nome final. }
        renamed: { type: boolean }
        merged: { type: boolean, description: O nome novo já existia e os dois foram fundidos. }
        active: { type: boolean }
        pending_updated: { type: integer }
        verified_renamed: { type: integer, description: Verificadas cujo arquivo foi renomeado. }
        failed:
          type: array
          items: { type: string }
          description: sha1 das imagens que não deu para renomear agora.
        complete: { type: boolean, description: "false: repita o pedido para terminar." }

    Vehicle:
      type: object
      properties:
        plate: { type: string, example: ABC1D23 }
        plate_type: { type: string, example: mercosul }
        plate_category: { type: string, example: private }
        type: { type: string, example: truck }
        color: { type: string, example: white }

    Image:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        status: { type: string, enum: [pending, verified] }
        original_name: { type: string }
        file_name: { type: string, description: "Nome v2, quando verified." }
        path: { type: string, description: Relativo à pasta de imagens do servidor. }
        ext: { type: string }
        size: { type: integer }
        encryption: { type: string, description: "Se o arquivo chegou criptografado, o formato aberto (ex. rc4-legacy)." }
        pattern_version: { type: string }
        equipment: { type: string }
        camera: { type: string }
        direction: { type: string }
        resolution: { type: string }
        capture_angle: { type: string }
        day_time: { type: string }
        image_range: { type: string }
        weather: { type: string }
        conditions:
          type: array
          items: { type: string }
        captured_at: { type: string, format: date-time }
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        ini:
          type: array
          description: O INI embutido no arquivo, na ordem original (sem a assinatura).
          items: { $ref: "#/components/schemas/INIEntry" }
        claimed_by: { type: string, description: Quem está anotando agora. }
        claimed_until: { type: string, format: date-time }
        queued_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    INIEntry:
      type: object
      properties:
        section: { type: string, example: NMetrologico }
        key: { type: string, example: Placa }
        value: { type: string, example: GGB5H24 }

    AnnotationRequest:
      type: object
      properties:
        equipment: { type: string }
        camera: { type: string }
        direction: { type: string }
        resolution: { type: string }
        capture_angle: { type: string }
        day_time: { type: string }
        image_range: { type: string }
        weather: { type: string }
        conditions:
          type: array
          items: { type: string }
        captured_at:
          type: string
          format: date-time
          description: Pode ter fuso (ex. -03:00); o servidor converte para UTC.
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        complete:
          type: boolean
          description: "false: rascunho. true: verifica e renomeia para v2."
      example:
        equipment: 8003-MF4739
        camera: hikvision-233
        direction: front
        resolution: 1920x1080
        capture_angle: lateral
        day_time: day
        image_range: narrow
        weather: clear
        conditions: [no_damage]
        captured_at: "2026-09-03T08:25:23-03:00"
        vehicles:
          - { plate: ABC1D23, plate_type: mercosul, plate_category: private, type: truck, color: white }
        complete: true

    PackageSummary:
      type: object
      properties:
        name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        total: { type: integer }
        verified: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer, description: Pendentes que alguém está anotando agora. }

    UploadResult:
      type: object
      properties:
        file: { type: string }
        sha1: { type: string }
        status: { type: string, enum: [created, duplicate, error] }
        existing_package: { type: string, description: "Se duplicate: onde ela já está." }
        decrypted: { type: string, description: "Formato de criptografia que foi aberto (ex. rc4-legacy)." }
        ini: { type: boolean, description: O arquivo tinha INI embutido. }
        prefilled: { type: boolean, description: "Nome v2 válido ou perfil de INI aplicado." }
        warnings:
          type: array
          items: { type: string }
          description: Ex. valor do INI sem tradução no perfil. Não impede o upload.
        error: { type: string }

    FieldRule:
      type: object
      description: Use `column`, `value` OU `template`.
      properties:
        column: { type: string, description: "No CSV, o nome da coluna. No INI, \"Secao.Chave\"." }
        value: { type: string, description: Valor fixo para o arquivo todo. }
        template:
          type: string
          description: Junta colunas. Se alguma estiver vazia, o resultado é vazio.
          example: "{Metrologico.Data} {Metrologico.Hora}.{Metrologico.Milisegundo}"
        map:
          type: object
          description: Valor de origem → nosso valor. Ignora maiúscula.
          additionalProperties: { type: string }
        split: { type: string, description: Só em conditions. }
        date_format: { type: string, description: "Só em captured_at. Layout do Go, ex. 2006-01-02 15:04:05.000" }
        timezone: { type: string, example: America/Sao_Paulo }

    Profile:
      type: object
      required: [name, reader, match]
      properties:
        name: { type: string, example: csv-pg-veiculos }
        description: { type: string }
        reader:
          type: object
          properties:
            type: { type: string, enum: [csv, jpeg-ini] }
            delimiter: { type: string, example: ";" }
            encoding: { type: string, enum: [utf-8, latin1] }
        match:
          type: object
          description: Só no CSV (no INI a imagem é a própria origem).
          properties:
            column: { type: string, example: imagem_nome }
            by: { type: string, enum: [original_name, sha1] }
        fields:
          type: object
          description: "Campos: equipment, camera, direction, resolution, capture_angle, day_time, image_range, weather, conditions, captured_at."
          additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        vehicles:
          type: object
          properties:
            mode: { type: string, enum: [single, row, columns], description: "single: um veículo por imagem (o caso do INI)." }
            max: { type: integer, description: Só no modo columns. }
            fields:
              type: object
              description: "Campos: plate (obrigatório), plate_type, plate_category, type, color. No modo columns, use {n} no nome da coluna."
              additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Inspection:
      type: object
      properties:
        rows: { type: integer }
        columns:
          type: array
          items: { type: string }
        sample:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        distinct:
          type: object
          additionalProperties:
            type: object
            properties:
              total: { type: integer }
              truncated: { type: boolean }
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    count: { type: integer }

    ImportReport:
      type: object
      properties:
        dry_run: { type: boolean }
        package: { type: string }
        profile: { type: string }
        overwrite: { type: boolean }
        rows: { type: integer, description: Linhas lidas (vazias são ignoradas). }
        records: { type: integer, description: Imagens descritas (linhas agrupadas). }
        unmapped:
          type: object
          description: Valores sem tradução, por campo, com a contagem. É o que falta no perfil.
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
          example: { weather: { Garoa: 12 } }
        missing_key: { type: integer }
        without_ini: { type: integer, description: "Perfil jpeg-ini: imagens pendentes sem INI embutido." }
        errors:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: "No import de INI: o sha1 da imagem." }
              line: { type: integer }
              field: { type: string }
              error: { type: string }
        error_count: { type: integer }
        matched: { type: integer }
        not_found:
          type: array
          items: { type: string }
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
        skipped_verified: { type: integer }
        skipped_claimed: { type: integer }
        unchanged: { type: integer }
        applied: { type: integer, description: "No ensaio: quantas seriam aplicadas." }
        conflicts: { type: integer }
        new_equipments:
          type: array
          items: { type: string }
        new_cameras:
          type: array
          items: { type: string }
        invalid_names:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              field: { type: string }
              value: { type: string }
              error: { type: string }
