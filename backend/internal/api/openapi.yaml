openapi: 3.0.3
info:
  title: SIDM API
  version: "1.0"
  description: |
    Controle e anotação de imagens de veículos.

    **Fluxo:** criar pacote → upload → fila de anotação (`/next`) → verificar (`PUT` com `complete: true`).

    **v1 interna, sem login:** quem está agindo vai no header `X-User`. Rode só na rede interna.

    **Listagens** respondem sempre `{"total": N, "items": [...]}`, com `limit` e `skip` para paginar.

    **Erros** respondem sempre `{"error": "mensagem"}`.

tags:
  - name: sistema
  - name: cadastros
    description: Equipamentos e câmeras.
  - name: pacotes
  - name: imagens
  - name: fila
    description: Fila de trabalho compartilhada (várias pessoas anotando o mesmo pacote).
  - name: import
    description: Import de metadados por CSV, usando perfis.
  - name: export
    description: |
      Datasets de treino (RF-DETR / YOLO / Pascal VOC). Entram as imagens **verificadas** e
      **anotadas na tarefa** escolhida que passam nos filtros do perfil (as
      anotadas sem nenhuma caixa entram como negativas). A divisão
      train/valid/test é **fixa por imagem** (pelo sha1). Perfis padrão:
      `rf-detr`, `yolo`, `voc` e `voc-pastas`.
  - name: perfis de anotação
    description: |
      O que se anota em cada imagem: os **campos da imagem** e os **tipos de
      objeto** (cada um com os seus campos; com caixa, o tipo é uma label do
      CVAT). O padrão `veiculos` reproduz os campos de sempre, com os códigos do
      nome v2. Cada pacote tem um perfil (`profile`), e as imagens guardam a
      anotação em `fields` e `objects`.
  - name: caixas
    description: |
      Caixas (bounding boxes) anotadas no CVAT, por **tarefa** (ex.: `capacete`,
      `placa-letras`): a mesma imagem pode estar em várias tarefas sem uma
      sobrescrever a outra. O SIDM não desenha caixas: manda as imagens para o
      CVAT (cvat.zip) e importa o export COCO 1.0 de volta, na tarefa.

paths:
  /health:
    get:
      tags: [sistema]
      summary: Saúde do serviço
      description: Responde `ok` se o Mongo está acessível.
      responses:
        "200":
          description: Tudo certo.
          content:
            text/plain:
              schema: { type: string, example: ok }
        "503":
          description: Mongo indisponível.

  /codes:
    get:
      tags: [cadastros]
      summary: Tabelas fixas do padrão v2
      description: |
        Para os dropdowns: código → valor, por campo. Equipamentos e câmeras
        **não** vêm aqui (têm busca própria: `/equipments` e `/cameras`).
      responses:
        "200":
          description: Tabelas por campo.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: string }
              example:
                day_time: { D: day, N: night }
                weather: { S: clear, C: rain, N: fog }

  /equipments:
    get:
      tags: [cadastros]
      summary: Buscar equipamentos (autocomplete)
      description: Busca por "contém", sem diferenciar maiúscula. `mf47` encontra `8003-MF4739`.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar equipamento
      description: O nome é sanitizado (espaço vira `-`; só `A-Z a-z 0-9 -`).
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cameras:
    get:
      tags: [cadastros]
      summary: Buscar câmeras (autocomplete)
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/LimitNames"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200": { $ref: "#/components/responses/NamePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [cadastros]
      summary: Cadastrar câmera
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "201": { $ref: "#/components/responses/NameCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /equipments/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar equipamento
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o nome v2 (no banco) é calculado de novo. Nenhum arquivo muda. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir equipamento
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /cameras/{name}:
    patch:
      tags: [cadastros]
      summary: Renomear ou ativar/desativar câmera
      description: |
        - `name`: renomeia **em cascata**. As pendentes trocam de nome no banco; nas
          verificadas, o nome v2 (no banco) é calculado de novo. Nenhum arquivo muda. Se o nome novo
          já existir, os dois são **fundidos** (útil para limpar duplicatas do import).
          Se alguma imagem falhar, o nome antigo é mantido e o mesmo pedido pode ser
          repetido para terminar (`complete: false`).
        - `active`: ativa ou desativa. Desativado some do autocomplete e não pode ser
          usado em novas verificações.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cadastros]
      summary: Excluir câmera
      description: |
        Em uso por alguma imagem: **desativa** (as imagens continuam intactas).
        Sem uso: apaga de vez.
      parameters:
        - $ref: "#/components/parameters/RegistryName"
      responses:
        "200":
          description: O que foi feito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  images: { type: integer, description: Quantas imagens usam. }
                  deleted: { type: boolean }
                  deactivated: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages:
    get:
      tags: [pacotes]
      summary: Listar pacotes com progresso
      description: Mais novos primeiro.
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de pacotes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PackageSummary" }
    post:
      tags: [pacotes]
      summary: Criar pacote
      description: |
        O nome vira nome de pasta no servidor, por isso é sanitizado. A pasta é
        criada na hora. `profile` é o perfil de anotação das imagens (sem ele, o
        padrão `veiculos`).
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageBody" }
            example: { name: Motos Setembro, profile: capacete-moto }
      responses:
        "201":
          description: Criado; o nome já sanitizado e o perfil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: Motos-Setembro }
                  profile: { type: string, example: capacete-moto }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /packages/{name}:
    patch:
      tags: [pacotes]
      summary: Renomear pacote ou trocar o perfil
      description: |
        `name`: renomeia a pasta no servidor, o cadastro e o caminho de todas as
        imagens (o nome dos arquivos não muda). `profile`: troca o perfil de
        anotação, **só enquanto o pacote não tem imagem verificada** (o nome do
        arquivo delas saiu do perfil atual). Com os dois, o perfil vai primeiro.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageBody" }
      responses:
        "200":
          description: Alterado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  profile: { type: string }
                  images: { type: integer, description: Imagens levadas para o nome novo. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [pacotes]
      summary: Excluir pacote (IRREVERSÍVEL)
      description: |
        Apaga o pacote, **todas as imagens dele** (banco e arquivos no disco) e o
        histórico. Para confirmar, repita o nome do pacote em `confirm`.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - name: confirm
          in: query
          required: true
          description: O nome do pacote, de novo.
          schema: { type: string }
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted_images: { type: integer }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/cvat.zip:
    get:
      tags: [caixas]
      summary: Imagens do pacote para o CVAT
      description: |
        Um zip com as imagens do pacote, com os nomes guardados no SIDM (que
        começam pelo sha1). Use-o para criar a task no CVAT: assim, o export de
        volta casa com as imagens sem ambiguidade. Imagens que não puderam ser
        incluídas são listadas em `FALTANDO.txt` dentro do zip.
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/boxes:
    get:
      tags: [caixas]
      summary: Tarefas em que o pacote tem imagens anotadas
      parameters:
        - $ref: "#/components/parameters/PackageName"
      responses:
        "200":
          description: Por tarefa, imagens do pacote anotadas nela e total de caixas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { type: string }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task: { type: string }
                        images: { type: integer }
                        boxes: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      tags: [caixas]
      summary: Tarefas de anotação (com o resumo de cada uma)
      responses:
        "200":
          description: Todas as tarefas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskView" }
    post:
      tags: [caixas]
      summary: Criar tarefa
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "201":
          description: Criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: capacete }
    get:
      tags: [caixas]
      summary: Uma tarefa, com os pacotes e as caixas por label
      responses:
        "200":
          description: A tarefa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskView" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [caixas]
      summary: Atualizar tarefa
      description: Mudar o nome leva junto as caixas e os perfis de export que apontam para ela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskBody" }
      responses:
        "200":
          description: Atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [caixas]
      summary: Apagar tarefa e as caixas dela
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  images: { type: integer, description: Imagens que tinham caixas na tarefa. }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{name}/import:
    post:
      tags: [caixas]
      summary: Importar caixas do CVAT (COCO 1.0) na tarefa
      description: |
        Mande o export da task do CVAT no formato **COCO 1.0** (o zip, ou só o
        `.json`). Por padrão é um **ensaio** (`dry_run=true`): nada é gravado.

        As imagens são procuradas no **banco todo** (qualquer pacote), pelo nome
        do arquivo (sem pasta): se começa pelo sha1, é por ele; senão, pelo
        nome original, só se for único no banco.

        - Imagens **sem caixa** no arquivo: com `negatives=false` (padrão) não
          são mexidas (o CVAT exporta todas as imagens da task, inclusive as não
          anotadas). Com `negatives=true` entram como anotadas e vazias: use só
          com a task do CVAT toda anotada.
        - Imagens cujo **tamanho** no CVAT difere do arquivo guardado são puladas.
        - Reimportar **substitui** as caixas da imagem nesta tarefa (as outras
          tarefas não mudam).
        - Labels que a tarefa ainda não tem são **acrescentadas** a ela.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/XUser"
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: negatives
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "Zip do CVAT ou o .json (COCO 1.0)." }
      responses:
        "200":
          description: Relatório.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export-folder-fields:
    get:
      tags: [export]
      summary: Metadados que podem virar pasta ou parte do nome (de um perfil de anotação)
      description: |
        Os metadados que um perfil de anotação dá às imagens, para os níveis de
        pasta (`layout: folders`) e o modelo de nome (`file_name`) de um perfil
        de export. Além de `sha1`, `name`, `original`, `package` e `split`
        (o grupo da divisão), cada campo da imagem vale pela chave
        (`day_time`) e cada campo de objeto sem caixa como `<tipo>_<campo>`
        (`vehicle_type`, do primeiro objeto do tipo). `values` traz cada valor
        possível e o nome padrão da pasta (na resolução, `01-640x480`); `null`
        = campo aberto (equipamento, número, texto): a pasta é o próprio valor.
      parameters:
        - name: annotation_profile
          in: query
          schema: { type: string, default: veiculos }
          description: O perfil de anotação (o `annotation_profile` do perfil de export).
      responses:
        "200":
          description: Os campos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotation_profile: { type: string, example: veiculos }
                  unknown: { type: string, example: Desconhecido, description: Pasta padrão das imagens sem o metadado. }
                  name_fields:
                    type: array
                    items: { type: string }
                    description: Campos aceitos no modelo de nome dos arquivos (file_name).
                  legacy_template: { type: string, description: "O padrão antigo (hash + características + placa). Vazio fora do perfil veiculos." }
                  fields:
                    type: array
                    description: Todos os metadados, com o nome na tela.
                    items:
                      type: object
                      properties:
                        field: { type: string, example: vehicle_type }
                        label: { type: string, example: "Veículo: Tipo de veículo" }
                        group: { type: string, description: "file, image ou o tipo do objeto (ex.: vehicle)." }
                        values:
                          type: object
                          nullable: true
                          additionalProperties: { type: string }
                        labels:
                          type: object
                          additionalProperties: { type: string }
                          description: Valor -> nome na tela.
                        folder: { type: boolean, description: Serve de nível de pasta. }
                        name: { type: boolean, description: Serve no modelo de nome. }
                        alias: { type: boolean, description: "Nome antigo ou atalho de outro campo (ex.: plate = vehicle_plate). Aceito, mas a tela não oferece." }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string, example: direction }
                        values:
                          type: object
                          nullable: true
                          additionalProperties: { type: string }
                          example: { front: front, rear: rear }

  /export-profiles:
    get:
      tags: [export]
      summary: Listar perfis de export
      description: Os padrões (`rf-detr`, `yolo`, com `builtin` true) e os salvos.
      responses:
        "200":
          description: Perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportProfile" }
    post:
      tags: [export]
      summary: Criar perfil de export
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /export-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: rf-detr }
    get:
      tags: [export]
      summary: Um perfil de export
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [export]
      summary: Atualizar perfil de export
      description: Os perfis padrão não podem ser alterados (salve uma cópia com outro nome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportProfile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [export]
      summary: Apagar perfil de export
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/preview:
    post:
      tags: [export]
      summary: Prévia do dataset
      description: O que vai sair, sem gerar o zip. `profile` é o nome de um perfil ou um perfil inteiro (montado na tela, sem salvar).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: Prévia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/download:
    post:
      tags: [export]
      summary: Baixar o dataset (zip)
      description: |
        Gera o zip enquanto baixa. Também aceita o pedido como formulário
        (`application/x-www-form-urlencoded`, campo `request` com o mesmo JSON),
        para o navegador salvar direto no disco.

        - **coco** (RF-DETR): `train/`, `valid/`, `test/`, cada um com as imagens e
          `_annotations.coco.json`.
        - **yolo** (Ultralytics): `images/{train,val,test}`, `labels/{train,val,test}`
          e `data.yaml`.

        Sempre vai junto um `export_info.json` (perfil, data, contagens). Caixas
        rotacionadas viram o menor retângulo reto que as contém.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request: { type: string, description: 'O mesmo JSON, ex.: {"profile":"yolo"}' }
      responses:
        "200":
          description: O zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /annotation-profiles:
    get:
      tags: [perfis de anotação]
      summary: Listar perfis de anotação
      description: O padrão (`veiculos`, com `builtin` true) e os salvos.
      responses:
        "200":
          description: Perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnnotationProfile" }
    post:
      tags: [perfis de anotação]
      summary: Criar perfil de anotação
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationProfile" }
      responses:
        "201":
          description: Criado (já limpo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "400": { $ref: "#/components/responses/Problems" }
        "409": { $ref: "#/components/responses/Conflict" }

  /annotation-profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: veiculos }
    get:
      tags: [perfis de anotação]
      summary: Um perfil de anotação
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [perfis de anotação]
      summary: Atualizar perfil de anotação
      description: O padrão não pode ser alterado (salve uma cópia com outro nome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationProfile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationProfile" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [perfis de anotação]
      summary: Apagar perfil de anotação
      description: O padrão não pode ser apagado, nem um perfil em uso por algum pacote (a mensagem diz quais).
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /annotation-profiles/{name}/check:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, example: veiculos }
    post:
      tags: [perfis de anotação]
      summary: Conferir uma anotação contra o perfil
      description: |
        Não grava nada. Devolve os valores limpos (texto sem espaços,
        maiúsculas onde o campo pede, data em UTC) ou a lista de problemas.
        Com `complete` true também cobra os obrigatórios e o mínimo de objetos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnnotationValues"
                - type: object
                  properties:
                    complete: { type: boolean }
            example:
              fields: { direction: rear, day_time: night }
              objects: [{ type: vehicle, fields: { plate: abc1d23, type: car } }]
              complete: true
      responses:
        "200":
          description: Válida; os valores limpos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationValues" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/next:
    post:
      tags: [fila]
      summary: Pegar a próxima imagem da fila
      description: |
        Entrega a imagem pendente livre mais antiga do pacote e reserva para o
        usuário por 15 minutos. Recarregar devolve a mesma imagem. Duas pessoas
        nunca recebem a mesma imagem.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUserRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skip:
                  type: string
                  description: sha1 da imagem atual, para pular (ela vai para o fim da fila).
      responses:
        "200":
          description: A imagem, já reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "204": { description: Fila vazia. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{name}/import:
    post:
      tags: [import]
      summary: Importar um CSV para os rascunhos do pacote
      description: |
        Casa cada linha do CSV com uma imagem do pacote e preenche o **rascunho**
        (nunca verifica). Equipamentos e câmeras novos são cadastrados.

        **O padrão é ensaio**: só grava com `dry_run=false`.

        Com um perfil do tipo `jpeg-ini`, **não mande arquivo**: o import usa o INI
        já guardado de cada imagem pendente do pacote.
      parameters:
        - $ref: "#/components/parameters/PackageName"
        - $ref: "#/components/parameters/XUser"
        - name: profile
          in: query
          required: true
          schema: { type: string }
        - name: dry_run
          in: query
          schema: { type: boolean, default: true }
        - name: overwrite
          in: query
          description: "false: só preenche campos vazios. true: o CSV substitui o rascunho."
          schema: { type: boolean, default: false }
      requestBody:
        required: false
        description: O CSV (não precisa com perfil jpeg-ini).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Relatório do import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Arquivo maior que 20 MB. }

  /images:
    get:
      tags: [imagens]
      summary: Buscar imagens
      description: |
        Filtros pelos campos do perfil de anotação: `fields.<campo>=valor` (um
        campo da imagem; numa lista, basta conter o valor) e
        `objects.<campo>=valor` (os de objeto valem para o **mesmo** objeto:
        `objects.type=truck&objects.color=white` não traz uma imagem com um
        caminhão preto e um carro branco). Ex.: `fields.day_time=night`.

        Os nomes de antes dos perfis continuam valendo: `equipment`, `camera`,
        `day_time`, `weather` e `direction` (= `fields.*`), e `vehicle_type`,
        `vehicle_color` e `plate` (= `objects.type`, `objects.color`,
        `objects.plate`).
      parameters:
        - { name: package, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, verified] } }
        - { name: fields.day_time, in: query, description: "Exemplo de fields.<campo>.", schema: { type: string } }
        - { name: objects.color, in: query, description: "Exemplo de objects.<campo>.", schema: { type: string } }
        - { name: equipment, in: query, schema: { type: string } }
        - { name: camera, in: query, schema: { type: string } }
        - { name: day_time, in: query, schema: { type: string } }
        - { name: weather, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string } }
        - { name: vehicle_type, in: query, schema: { type: string } }
        - { name: vehicle_color, in: query, schema: { type: string } }
        - { name: plate, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de imagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Image" }
    post:
      tags: [imagens]
      summary: Upload de imagens para um pacote
      description: |
        Imagem repetida (mesmo conteúdo) que já está em outro pacote é **pulada**,
        e o resto do lote segue.

        O INI que o equipamento grava **dentro** do JPEG é sempre guardado no banco
        (menos a assinatura). Com `profile` (do tipo `jpeg-ini`), ele também
        pré-preenche o rascunho. O arquivo nunca é alterado.

        **Arquivos criptografados** pelo equipamento são abertos sozinhos: o
        formato RC4 legado (qualquer extensão; vira `.jpg`). O hash, o INI e o
        arquivo guardado são os do original aberto. O formato PGP ainda é recusado.
      parameters:
        - name: package
          in: query
          required: true
          schema: { type: string }
        - name: profile
          in: query
          description: Perfil do tipo jpeg-ini, opcional.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Resultado de cada arquivo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/exists:
    post:
      tags: [imagens]
      summary: Quais hashes já existem
      description: O front pergunta antes de subir, para não mandar GB repetido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha1s]
              properties:
                sha1s:
                  type: array
                  maxItems: 1000
                  items: { type: string }
      responses:
        "200":
          description: Separados em existentes e faltando.
          content:
            application/json:
              schema:
                type: object
                properties:
                  existing:
                    type: array
                    items:
                      type: object
                      properties:
                        sha1: { type: string }
                        package: { type: string }
                        status: { type: string }
                  missing:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /images/{sha1}:
    get:
      tags: [imagens]
      summary: Detalhe de uma imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: A imagem (inclui o rascunho salvo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [imagens]
      summary: Salvar rascunho ou verificar
      description: |
        Substitui **toda** a anotação: os campos (`fields`) e os objetos sem
        caixa (`objects`), pelo **perfil de anotação do pacote**.

        - `complete: false`: salva o rascunho (continua pending).
        - `complete: true`: valida tudo (inclusive os campos obrigatórios do
          perfil), calcula o nome (`file_name`) e marca verified.

        O que vem preenchido tem que ser válido no perfil; os erros voltam todos
        juntos em `problems`, cada um com o caminho (ex.: `fields.day_time`,
        `objects[0].plate`). Equipamento e câmera precisam estar cadastrados.

        **O arquivo não muda de nome:** no disco toda imagem é `<sha1>.ext`. No
        perfil `veiculos`, o `file_name` guarda o nome v2 (o que não se sabe vira
        uma posição vazia), que o export usa; nos outros perfis, `<sha1>.ext`.

        Usa optimistic locking: se alguém gravou no meio, responde 409.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationRequest" }
      responses:
        "200":
          description: A imagem atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Problems" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [imagens]
      summary: Excluir imagem (IRREVERSÍVEL)
      description: Apaga o registro, o histórico e o arquivo. Recusa (409) se outra pessoa está anotando.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUser"
      responses:
        "200":
          description: Apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha1: { type: string }
                  deleted: { type: boolean }
                  warnings:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/reopen:
    post:
      tags: [fila]
      summary: Reabrir para edição
      description: |
        Uma imagem **verificada** volta para **pendente**: o nome v2 (`file_name`)
        sai do banco e os metadados ficam como rascunho. O arquivo não muda. Já fica
        **reservada** para quem pediu (15 min, como na fila), para ninguém pegar
        no meio. Numa pendente, só reserva. As caixas do CVAT não mudam.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A imagem, agora pendente e reservada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /images/{sha1}/boxes:
    get:
      tags: [caixas]
      summary: Caixas de uma imagem (em todas as tarefas)
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: As caixas, em pixels da imagem, uma entrada por tarefa (vazio se nenhuma).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoxSet" }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/file:
    get:
      tags: [imagens]
      summary: O arquivo da imagem
      parameters:
        - $ref: "#/components/parameters/SHA1"
      responses:
        "200":
          description: Os bytes da imagem.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /images/{sha1}/release:
    post:
      tags: [fila]
      summary: Devolver a imagem para a fila
      description: Só quem está com a imagem consegue liberar. Sem chamar, o prazo vence sozinho em 15 min.
      parameters:
        - $ref: "#/components/parameters/SHA1"
        - $ref: "#/components/parameters/XUserRequired"
      responses:
        "204": { description: Liberada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/inspect:
    post:
      tags: [import]
      summary: Raio-x de um CSV (ou do INI de algumas imagens)
      description: |
        Para escrever um perfil novo: colunas, linhas de exemplo e os valores
        distintos de cada coluna. Não precisa de perfil.

        Com `type=jpeg-ini`, mande de 1 a 20 imagens no campo `file`: cada
        imagem vira uma linha, e cada chave do INI embutido (`Secao.Chave`)
        vira uma coluna. Imagens criptografadas são abertas antes. A
        `Assinatura` não aparece.
      parameters:
        - name: type
          in: query
          description: "`jpeg-ini` para ler o INI de imagens em vez de um CSV."
          schema: { type: string, enum: [csv, jpeg-ini], default: csv }
        - name: delimiter
          in: query
          description: Por nome, porque ";" cru é descartado na URL.
          schema: { type: string, enum: [comma, semicolon, tab, pipe], default: comma }
        - name: encoding
          in: query
          schema: { type: string, enum: [utf-8, latin1], default: utf-8 }
      requestBody: { $ref: "#/components/requestBodies/CSVFile" }
      responses:
        "200":
          description: O raio-x.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /import-profiles:
    get:
      tags: [import]
      summary: Listar perfis de import
      parameters:
        - $ref: "#/components/parameters/SearchQ"
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: Página de perfis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
    post:
      tags: [import]
      summary: Criar perfil de import
      description: Validado antes de salvar; os erros vêm todos juntos.
      parameters:
        - $ref: "#/components/parameters/XUser"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /import-profiles/{name}:
    get:
      tags: [import]
      summary: Um perfil
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: O perfil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [import]
      summary: Atualizar perfil
      description: Ex. o ensaio mostrou "Garoa" sem tradução; adicione no map e mande de novo.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [import]
      summary: Renomear perfil
      description: Só troca o nome. Para mudar o conteúdo, use o PUT com o JSON inteiro.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      requestBody: { $ref: "#/components/requestBodies/Name" }
      responses:
        "200":
          description: O perfil, com o nome novo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [import]
      summary: Apagar perfil
      description: Os rascunhos que o perfil já preencheu continuam nas imagens.
      parameters:
        - $ref: "#/components/parameters/ProfileName"
      responses:
        "200":
          description: Apagado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    XUser:
      name: X-User
      in: header
      description: Quem está agindo (vai para o histórico). Sem ele, "anonymous".
      schema: { type: string, example: nathan }
    XUserRequired:
      name: X-User
      in: header
      required: true
      description: Quem está anotando.
      schema: { type: string, example: nathan }
    SHA1:
      name: sha1
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{40}$" }
    PackageName:
      name: name
      in: path
      required: true
      schema: { type: string, example: pacote-8003 }
    RegistryName:
      name: name
      in: path
      required: true
      schema: { type: string, example: 8003-MF4739 }
    ProfileName:
      name: name
      in: path
      required: true
      schema: { type: string, example: csv-pg-veiculos }
    SearchQ:
      name: q
      in: query
      description: Contém, sem diferenciar maiúscula. Máx. 64 caracteres.
      schema: { type: string, maxLength: 64 }
    LimitNames:
      name: limit
      in: query
      schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
    Skip:
      name: skip
      in: query
      schema: { type: integer, default: 0, minimum: 0 }

  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: 8003 MF4739 }
    CSVFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }

  responses:
    BadRequest:
      description: Dado inválido; a mensagem diz o quê.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Não encontrado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicado, imagem com outra pessoa, ou alterada por outra pessoa no meio.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Problems:
      description: Inválido; `problems` diz onde está cada erro (todos de uma vez).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "fields[0].type: tipo \"lista\" não existe (e mais 1)" }
              problems:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string, example: "fields[0].type" }
                    msg: { type: string }
    NameCreated:
      description: Criado; devolve o nome já sanitizado.
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, example: 8003-MF4739 }
    NamePage:
      description: Página de nomes.
      content:
        application/json:
          schema:
            type: object
            properties:
              total: { type: integer }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    AnnotationField:
      type: object
      required: [key, type]
      properties:
        key: { type: string, example: day_time, description: "Nome no banco: minúsculas, números e _." }
        label: { type: string, example: Dia/noite }
        type: { type: string, enum: [choice, multi, text, number, bool, datetime, ref] }
        required: { type: boolean, description: Obrigatório para verificar. }
        help: { type: string }
        default: { description: "O valor que a tela já traz numa imagem sem rascunho (tem que ser válido no campo)." }
        options:
          type: array
          description: "choice e multi. `code` é a forma curta no nome do arquivo (se uma opção tem, todas têm)."
          items:
            type: object
            properties:
              value: { type: string, example: night }
              label: { type: string, example: Noite }
              code: { type: string, example: N }
        pattern: { type: string, description: "text: expressão regular do valor inteiro.", example: "[A-Z0-9]{7}" }
        max_len: { type: integer, description: text }
        upper: { type: boolean, description: "text: guarda em maiúsculas." }
        min: { type: number, description: number }
        max: { type: number, description: number }
        integer: { type: boolean, description: number }
        ref: { type: string, enum: [equipment, camera], description: "ref: qual cadastro." }

    AnnotationProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, example: capacete-moto }
        description: { type: string }
        builtin: { type: boolean, readOnly: true }
        fields:
          type: array
          description: Os campos da imagem.
          items: { $ref: "#/components/schemas/AnnotationField" }
        objects:
          type: array
          description: Os tipos de objeto.
          items:
            type: object
            required: [key]
            properties:
              key: { type: string, example: helmet, description: "Com caixa, é a label do CVAT." }
              label: { type: string, example: Capacete }
              box: { type: boolean, description: "Cada objeto é uma caixa (vem do CVAT). Sem caixa, é uma lista na imagem." }
              min: { type: integer, description: Mínimo por imagem para verificar. }
              max: { type: integer, description: "Máximo por imagem (0 = sem limite)." }
              fields:
                type: array
                items: { $ref: "#/components/schemas/AnnotationField" }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    AnnotationValues:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
          example: { direction: rear, conditions: [glare] }
        objects:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: vehicle }
              fields: { type: object, additionalProperties: true }

    ExportProfile:
      type: object
      required: [name, format, split]
      properties:
        name: { type: string, example: yolo-placas-noite }
        description: { type: string }
        format: { type: string, enum: [coco, yolo, voc], description: "coco = RF-DETR (layout do Roboflow); voc = Pascal VOC (um .xml por imagem, ao lado dela)." }
        file_name:
          type: string
          example: "{sha1}{direction}{resolution}{capture_angle}{day_time}{vehicle_type}{image_range}{plate_type}{plate_category}{weather}{condition}{plate}"
          description: |
            Modelo do nome dos arquivos de saída (a extensão é a do arquivo guardado);
            vazio = o nome do SIDM (v2). Campos entre chaves (ver name_fields em
            GET /export-folder-fields?annotation_profile=...); os de lista com código
            saem com o código (no perfil veiculos, o do nome v2: direção F/T,
            resolução 01…10, …). Campo sem valor vira "_" na largura dele. Tem que
            ter {sha1} ou {name}.
        layout:
          type: string
          enum: [split, folders]
          default: split
          description: "split = train/valid/test; folders = árvore de pastas pelos metadados (só VOC; a divisão só vale com um nível split)."
        folders:
          type: array
          description: Níveis de pasta, na ordem (layout folders).
          items:
            type: object
            required: [field]
            properties:
              field: { type: string, example: direction, description: "Um dos campos de GET /export-folder-fields." }
              names:
                type: object
                additionalProperties: { type: string }
                description: Valor -> nome da pasta (os que faltam usam o nome padrão).
                example: { front: Dianteiro, rear: Traseiro }
              unknown: { type: string, description: "Pasta das imagens sem o metadado (padrão: Desconhecido)." }
        task: { type: string, description: "Tarefa de anotação (vazio = escolher na hora de exportar)." }
        annotation_profile:
          type: string
          default: veiculos
          description: |
            O perfil de anotação cujos campos os filtros, as pastas e o modelo de
            nome usam. Não limita os pacotes: imagem de pacote de outro perfil só
            não tem os campos (não passa nos filtros; vai para "Desconhecido").
        split:
          type: object
          description: Porcentagens, somam 100. No YOLO, valid > 0.
          properties:
            train: { type: integer, example: 70 }
            valid: { type: integer, example: 15 }
            test: { type: integer, example: 15 }
        packages:
          type: array
          items: { type: string }
          description: Pacotes que entram (vazio = todos).
        filters:
          type: object
          description: |
            Nos campos do perfil de anotação, com os mesmos valores da anotação
            (vazio = qualquer). Os nomes antigos (equipment, day_time,
            vehicle_type...) ainda são aceitos e viram fields/objects.
          properties:
            fields:
              type: object
              additionalProperties: { type: string }
              description: "Campo da imagem -> valor (numa lista, basta conter; número e sim/não como texto: \"2\", \"true\")."
              example: { day_time: night, riders: "2" }
            objects:
              type: object
              description: Tipo de objeto -> campo -> valor. Os campos de um tipo valem para o MESMO objeto.
              additionalProperties:
                type: object
                additionalProperties: { type: string }
              example: { vehicle: { type: truck, color: white } }
            equipment: { type: string }
            camera: { type: string }
            direction: { type: string, example: rear }
            day_time: { type: string, example: night }
            weather: { type: string, example: rain }
            vehicle_type: { type: string }
            vehicle_color: { type: string }
        labels:
          type: object
          properties:
            rename:
              type: object
              additionalProperties: { type: string }
              description: Label do CVAT -> classe. Dois nomes iguais juntam as classes.
              example: { Placa: placa }
            include:
              type: array
              items: { type: string }
              description: Classes que entram, NA ORDEM dos ids (vazio = todas, em ordem alfabética).
              example: [carro, moto, placa]
        builtin: { type: boolean, readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ExportRequest:
      type: object
      required: [profile]
      properties:
        profile:
          description: Nome de um perfil (padrão ou salvo) ou o perfil inteiro.
          oneOf:
            - { type: string, example: rf-detr }
            - { $ref: "#/components/schemas/ExportProfile" }
        task:
          type: string
          example: capacete
          description: Tarefa cujas caixas entram. Vale mais que a do perfil; um dos dois é obrigatório.

    ExportPreview:
      type: object
      properties:
        profile: { type: string }
        task: { type: string }
        format: { type: string }
        layout: { type: string }
        split:
          type: object
          properties:
            train: { type: integer }
            valid: { type: integer }
            test: { type: integer }
        classes:
          type: array
          items: { type: string }
          description: Na ordem dos ids (YOLO começa em 0, COCO em 1).
        total: { type: integer }
        negatives: { type: integer, description: Das imagens do dataset, as sem nenhuma caixa. }
        images:
          type: object
          additionalProperties: { type: integer }
          description: Imagens por grupo (train/valid/test).
        folders:
          type: object
          additionalProperties: { type: integer }
          description: Imagens por pasta (layout folders).
        examples:
          type: array
          items: { type: string }
          description: Os primeiros nomes de arquivo, como vão sair (com a pasta).
        boxes:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por classe.
        skipped:
          type: object
          properties:
            not_annotated: { type: integer, description: Verificadas, mas não anotadas na tarefa. }
            without_labels: { type: integer, description: "Com caixas, mas nenhuma das classes escolhidas." }
        packages:
          type: array
          items: { type: string }

    Box:
      type: object
      properties:
        label: { type: string, example: placa }
        x: { type: number, description: "Canto superior esquerdo, em pixels." }
        y: { type: number }
        w: { type: number, description: Largura em pixels. }
        h: { type: number, description: Altura em pixels. }
        occluded: { type: boolean }
        rotation: { type: number, description: "Graus, sentido horário (como no CVAT)." }
        attributes:
          type: object
          additionalProperties: true
          description: "Atributos criados no CVAT (ex.: { caractere: A })."

    BoxSet:
      type: object
      properties:
        task: { type: string }
        sha1: { type: string }
        package: { type: string }
        width: { type: integer }
        height: { type: integer }
        boxes:
          type: array
          items: { $ref: "#/components/schemas/Box" }
        source:
          type: object
          properties:
            tool: { type: string, example: cvat }
            format: { type: string, example: coco }
            file: { type: string, description: Arquivo importado. }
            file_name: { type: string, description: Nome da imagem dentro do arquivo. }
        imported_by: { type: string }
        imported_at: { type: string, format: date-time }

    BoxImportReport:
      type: object
      properties:
        dry_run: { type: boolean }
        task: { type: string }
        file: { type: string }
        negatives: { type: boolean }
        file_images: { type: integer, description: Imagens no arquivo. }
        file_boxes: { type: integer, description: Caixas válidas no arquivo. }
        labels:
          type: object
          additionalProperties: { type: integer }
          description: Caixas por label, das imagens que serão gravadas.
        new_labels:
          type: array
          items: { type: string }
          description: Labels que a tarefa não tinha (acrescentadas ao aplicar).
        matched: { type: integer, description: Imagens do arquivo encontradas no SIDM. }
        packages:
          type: object
          additionalProperties: { type: integer }
          description: Das imagens que serão gravadas, quantas por pacote.
        not_found:
          type: array
          items: { type: string }
          description: Até 20 nomes não encontrados.
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
          description: Nome original repetido no banco.
        empty: { type: integer, description: "Encontradas, mas sem caixa no arquivo (gravadas só com negatives=true)." }
        size_mismatch:
          type: array
          items:
            type: object
            properties:
              file_name: { type: string }
              cvat: { type: string, example: 1280x720 }
              sidm: { type: string, example: 1920x1080 }
        will_apply: { type: integer, description: Imagens que serão gravadas. }
        replaced: { type: integer, description: Dessas, as que já estavam na tarefa (substituídas ao aplicar). }
        applied: { type: integer }
        applied_boxes: { type: integer }
        warnings:
          type: array
          items: { type: string }
          description: Caixas ignoradas na leitura do arquivo.

    TaskBody:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: placa-letras }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
          example: [com_capacete, sem_capacete]

    Task:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskView:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            stats:
              type: object
              properties:
                images: { type: integer, description: Imagens anotadas na tarefa. }
                verified: { type: integer, description: Dessas, as verificadas (entram no export). }
                negatives: { type: integer, description: Anotadas sem nenhuma caixa. }
                boxes: { type: integer }
                labels:
                  type: object
                  additionalProperties: { type: integer }
                packages:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      images: { type: integer }
                      verified: { type: integer }

    RegistryReport:
      type: object
      properties:
        name: { type: string, description: O nome final. }
        renamed: { type: boolean }
        merged: { type: boolean, description: O nome novo já existia e os dois foram fundidos. }
        active: { type: boolean }
        pending_updated: { type: integer }
        verified_renamed: { type: integer, description: Verificadas cujo arquivo foi renomeado. }
        failed:
          type: array
          items: { type: string }
          description: sha1 das imagens que não deu para renomear agora.
        complete: { type: boolean, description: "false: repita o pedido para terminar." }

    Image:
      type: object
      properties:
        sha1: { type: string }
        package: { type: string }
        status: { type: string, enum: [pending, verified] }
        original_name: { type: string }
        file_name: { type: string, description: "Nome v2, quando verified." }
        path: { type: string, description: Relativo à pasta de imagens do servidor. }
        ext: { type: string }
        size: { type: integer }
        encryption: { type: string, description: "Se o arquivo chegou criptografado, o formato aberto (ex. rc4-legacy)." }
        pattern_version: { type: string, description: '"v2" quando o file_name é o nome v2 (verificada no perfil veiculos).' }
        fields:
          type: object
          additionalProperties: true
          description: Os campos da imagem, pelo perfil de anotação do pacote.
          example: { equipment: 8003-MF4739, direction: rear, day_time: night, conditions: [glare], captured_at: "2026-09-03T11:25:23Z" }
        objects:
          type: array
          description: Os objetos sem caixa (ex. os veículos).
          items:
            type: object
            properties:
              type: { type: string, example: vehicle }
              fields: { type: object, additionalProperties: true, example: { plate: ABC1D23, type: truck, color: white } }
        ini:
          type: array
          description: O INI embutido no arquivo, na ordem original (sem a assinatura).
          items: { $ref: "#/components/schemas/INIEntry" }
        claimed_by: { type: string, description: Quem está anotando agora. }
        claimed_until: { type: string, format: date-time }
        queued_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    INIEntry:
      type: object
      properties:
        section: { type: string, example: NMetrologico }
        key: { type: string, example: Placa }
        value: { type: string, example: GGB5H24 }

    AnnotationRequest:
      allOf:
        - $ref: "#/components/schemas/AnnotationValues"
        - type: object
          properties:
            complete:
              type: boolean
              description: "false: rascunho. true: verifica (cobra os obrigatórios) e calcula o nome (file_name)."
      example:
        fields:
          equipment: 8003-MF4739
          camera: hikvision-233
          direction: front
          resolution: 1920x1080
          day_time: day
          conditions: [no_damage]
          captured_at: "2026-09-03T08:25:23-03:00"
        objects:
          - { type: vehicle, fields: { plate: ABC1D23, plate_type: mercosul, plate_category: private, type: truck, color: white } }
        complete: true

    PackageBody:
      type: object
      properties:
        name: { type: string, example: Noturnas Setembro }
        profile: { type: string, example: veiculos, description: Perfil de anotação. }

    PackageSummary:
      type: object
      properties:
        name: { type: string }
        profile: { type: string, description: O perfil de anotação do pacote., example: veiculos }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        total: { type: integer }
        verified: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer, description: Pendentes que alguém está anotando agora. }

    UploadResult:
      type: object
      properties:
        file: { type: string }
        sha1: { type: string }
        status: { type: string, enum: [created, duplicate, error] }
        existing_package: { type: string, description: "Se duplicate: onde ela já está." }
        decrypted: { type: string, description: "Formato de criptografia que foi aberto (ex. rc4-legacy)." }
        ini: { type: boolean, description: O arquivo tinha INI embutido. }
        prefilled: { type: boolean, description: "Nome v2 válido ou perfil de INI aplicado." }
        warnings:
          type: array
          items: { type: string }
          description: Ex. valor do INI sem tradução no perfil. Não impede o upload.
        error: { type: string }

    FieldRule:
      type: object
      description: Use `column`, `value` OU `template`.
      properties:
        column: { type: string, description: "No CSV, o nome da coluna. No INI, \"Secao.Chave\"." }
        value: { type: string, description: Valor fixo para o arquivo todo. }
        template:
          type: string
          description: Junta colunas. Se alguma estiver vazia, o resultado é vazio.
          example: "{Metrologico.Data} {Metrologico.Hora}.{Metrologico.Milisegundo}"
        map:
          type: object
          description: |
            Valor de origem → nosso valor (um valor aceito pelo campo). Ignora
            maiúscula. Sem map, um campo de lista aceita o valor, o código ou o
            nome da opção na tela; número aceita vírgula decimal; sim/não aceita
            true/false, sim/não, 1/0.
          additionalProperties: { type: string }
        split: { type: string, description: "Só em campo de vários valores (multi), como conditions." }
        date_format: { type: string, description: "Só em campo de data e hora (como captured_at). Layout do Go, ex. 2006-01-02 15:04:05.000" }
        timezone: { type: string, example: America/Sao_Paulo }

    Profile:
      type: object
      required: [name, reader, match]
      properties:
        name: { type: string, example: csv-pg-veiculos }
        description: { type: string }
        annotation_profile:
          type: string
          default: veiculos
          description: |
            O perfil de anotação que este perfil preenche: as chaves de fields e
            de objects são as dele, e os valores dos map são conferidos contra
            ele. Num pacote de outro perfil, o que ele não tem fica de fora e é
            listado (outside_profile).
        reader:
          type: object
          properties:
            type: { type: string, enum: [csv, jpeg-ini] }
            delimiter: { type: string, example: ";" }
            encoding: { type: string, enum: [utf-8, latin1] }
        match:
          type: object
          description: Só no CSV (no INI a imagem é a própria origem).
          properties:
            column: { type: string, example: imagem_nome }
            by: { type: string, enum: [original_name, sha1] }
        fields:
          type: object
          description: "Campos da imagem do perfil de anotação (no veiculos: equipment, camera, direction, resolution, capture_angle, day_time, image_range, weather, conditions, captured_at)."
          additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        objects:
          type: object
          description: Tipo de objeto sem caixa do perfil de anotação (ex. vehicle) -> como achar os objetos dele.
          additionalProperties:
            type: object
            required: [mode, fields]
            properties:
              mode: { type: string, enum: [single, row, columns], description: "single: um objeto por imagem (o caso do INI); row: um por linha; columns: colunas numeradas." }
              max: { type: integer, description: Só no modo columns. }
              key: { type: string, example: plate, description: "O campo que diz que o objeto existe (sem valor nele, não há objeto). Vazio: existe se algum campo de coluna tem valor." }
              fields:
                type: object
                description: "Campos do tipo de objeto (no vehicle: plate, plate_type, plate_category, type, color). No modo columns, use {n} no nome da coluna."
                additionalProperties: { $ref: "#/components/schemas/FieldRule" }
        vehicles:
          type: object
          deprecated: true
          description: "Formato antigo: o mesmo que objects.vehicle com key plate. Aceito na entrada; volta como objects."
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Inspection:
      type: object
      properties:
        rows: { type: integer }
        columns:
          type: array
          items: { type: string }
        sample:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        distinct:
          type: object
          additionalProperties:
            type: object
            properties:
              total: { type: integer }
              truncated: { type: boolean }
              values:
                type: array
                items:
                  type: object
                  properties:
                    value: { type: string }
                    count: { type: integer }

    ImportReport:
      type: object
      properties:
        dry_run: { type: boolean }
        package: { type: string }
        profile: { type: string }
        overwrite: { type: boolean }
        rows: { type: integer, description: Linhas lidas (vazias são ignoradas). }
        records: { type: integer, description: Imagens descritas (linhas agrupadas). }
        unmapped:
          type: object
          description: Valores sem tradução, por campo, com a contagem. É o que falta no perfil.
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
          example: { weather: { Garoa: 12 } }
        missing_key: { type: integer }
        without_ini: { type: integer, description: "Perfil jpeg-ini: imagens pendentes sem INI embutido." }
        errors:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: "No import de INI: o sha1 da imagem." }
              line: { type: integer }
              field: { type: string }
              error: { type: string }
        error_count: { type: integer }
        matched: { type: integer }
        not_found:
          type: array
          items: { type: string }
        not_found_count: { type: integer }
        ambiguous:
          type: array
          items: { type: string }
        skipped_verified: { type: integer }
        skipped_claimed: { type: integer }
        unchanged: { type: integer }
        applied: { type: integer, description: "No ensaio: quantas seriam aplicadas." }
        conflicts: { type: integer }
        new_equipments:
          type: array
          items: { type: string }
        new_cameras:
          type: array
          items: { type: string }
        invalid_names:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              field: { type: string }
              value: { type: string }
              error: { type: string }
        outside_profile:
          type: array
          description: Valores que o perfil de anotação do pacote não tem ou não aceita (ficam de fora; até 100).
          items: { type: string, example: "linha 2: weather: o perfil capacete-moto não tem este campo" }
        outside_profile_count: { type: integer }
